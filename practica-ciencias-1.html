<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Ciencias 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #27ae60; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #2ecc71; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #27ae60; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #219a52; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #27ae60; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>La Célula y los Niveles de Organización</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- Enlace al controlador de Firebase (Asegúrate de que la ruta sea correcta según tu proyecto en Vercel) -->
<script src="controlador-firebase.js" type="module"></script>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Cuál es la unidad básica y funcional de todo ser vivo?", "opciones": {"a": "El tejido", "b": "La célula", "c": "El átomo"}, "correcta": "b", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "Un organismo que está formado por una sola célula se llama:", "opciones": {"a": "Pluricelular", "b": "Acelular", "c": "Unicelular"}, "correcta": "c", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "Un organismo formado por muchas células (como un ser humano) se llama:", "opciones": {"a": "Unicelular", "b": "Pluricelular", "c": "Multiorgánico"}, "correcta": "b", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "El conjunto de células similares que trabajan juntas para cumplir una misma función forma un:", "opciones": {"a": "Órgano", "b": "Sistema", "c": "Tejido"}, "correcta": "c", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "El corazón, los pulmones y el estómago son ejemplos de:", "opciones": {"a": "Sistemas", "b": "Tejidos", "c": "Órganos"}, "correcta": "c", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "Un grupo de órganos que trabajan en equipo para realizar una gran función forman un:", "opciones": {"a": "Organismo", "b": "Sistema", "c": "Órgano principal"}, "correcta": "b", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "¿Cuál es el orden correcto de los niveles de organización (del más pequeño al más grande)?", "opciones": {"a": "Célula - Tejido - Órgano - Sistema - Organismo", "b": "Tejido - Célula - Sistema - Órgano - Organismo", "c": "Organismo - Sistema - Órgano - Tejido - Célula"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "¿Cuál de las siguientes opciones es un tejido?", "opciones": {"a": "Corazón", "b": "Tejido sanguíneo (sangre)", "c": "Sistema respiratorio"}, "correcta": "b", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Cuál de las siguientes opciones es un sistema?", "opciones": {"a": "Sistema Circulatorio", "b": "Célula de la piel", "c": "Hígado"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "¿A qué nivel de organización pertenece una neurona?", "opciones": {"a": "Célula", "b": "Órgano", "c": "Tejido"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "¿A qué nivel de organización pertenece un ser humano completo?", "opciones": {"a": "Sistema", "b": "Tejido", "c": "Organismo"}, "correcta": "c", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "Si juntamos el tejido muscular, el tejido nervioso y otros tejidos, formamos un:", "opciones": {"a": "Órgano", "b": "Organismo", "c": "Sistema"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "¿Qué función tiene principalmente el Sistema Digestivo?", "opciones": {"a": "Respirar aire", "b": "Digerir los alimentos", "c": "Bombear sangre"}, "correcta": "b", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "¿Por qué decimos que la célula es 'estructural'?", "opciones": {"a": "Porque construye todas las partes o estructuras del ser vivo", "b": "Porque son de piedra", "c": "Porque no se mueven"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "Los glóbulos rojos son ejemplos de:", "opciones": {"a": "Células", "b": "Órganos", "c": "Sistemas"}, "correcta": "a", "explicacion": "Revisa los niveles de organización biológica.<br><a href='resumen-ciencias-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Escribe el nombre del nivel de organización que está formado por la unión de varios tejidos:", "keywords": ["organo", "órgano", "organos", "órganos"], "explicacion": "Un órgano se compone de tejidos."}, {"id": "q17", "type": "text", "pregunta": "El nivel más pequeño y básico que tiene vida propia se llama...", "keywords": ["celula", "célula"], "explicacion": "Es la célula."}, {"id": "q18", "type": "text", "pregunta": "Un perro, un árbol y un humano pertenecen al nivel de organización llamado...", "keywords": ["organismo", "individuo"], "explicacion": "Es el ser vivo completo."}, {"id": "q19", "type": "text", "pregunta": "¿Cómo se llama el grupo de órganos que trabajan juntos, como el respiratorio o el digestivo?", "keywords": ["sistema", "sistemas", "aparato", "aparatos"], "explicacion": "Se le llama sistema o aparato."}, {"id": "q20", "type": "text", "pregunta": "Las bacterias son seres vivos formados por una sola célula, por lo que son organismos...", "keywords": ["unicelulares", "unicelular"], "explicacion": "Unicelular = Una sola célula."}, {"id": "q21", "type": "textarea", "pregunta": "Desarrollo: Explica la diferencia entre un organismo unicelular y uno pluricelular, y da un ejemplo de cada uno.", "keywords": [], "explicacion": "El unicelular tiene una sola célula (como una bacteria) y el pluricelular tiene millones (como un perro o un árbol)."}, {"id": "q22", "type": "textarea", "pregunta": "Desarrollo: ¿Por qué es importante que las células se agrupen formando tejidos y órganos en los seres humanos?", "keywords": [], "explicacion": "Porque el cuerpo humano es muy grande y complejo; agrupándose pueden dividirse el trabajo, hacer funciones especializadas y mantenernos con vida."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Construye la escalera de los niveles de organización del cuerpo utilizando este ejemplo: (Corazón, Sistema Circulatorio, Célula muscular cardíaca, Ser Humano, Tejido muscular). Ordénalos del más pequeño al más grande.", "keywords": [], "explicacion": "Célula muscular cardíaca -> Tejido muscular -> Corazón -> Sistema Circulatorio -> Ser Humano."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: ¿Qué pasaría con un sistema (como el digestivo) si uno de sus órganos principales (como el estómago) deja de funcionar?", "keywords": [], "explicacion": "El sistema completo fallaría, porque todos los órganos deben trabajar en equipo para lograr la función (en este caso, digerir alimentos)."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: Si la sangre es un líquido, ¿por qué la ciencia la clasifica como un 'tejido'?", "keywords": [], "explicacion": "Porque está formada por la unión de miles de células que trabajan juntas (los glóbulos rojos, blancos y plaquetas), cumpliendo con la definición de tejido."}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        let respuestasCorrectasTotales = 0;
        let preguntasCompletadas = 0;

        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            
            // Si ya estaba correcta o bloqueada, la sumamos a completadas
            if (block.classList.contains('correct')) {
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
                return;
            }
            if (block.classList.contains('locked')) {
                preguntasCompletadas++;
                return;
            }

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                    preguntasCompletadas++;
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });

        // ==========================================
        // INTEGRACIÓN CON CONTROLADOR FIREBASE
        // ==========================================
        if (preguntasCompletadas === dbPreguntas.length) {
            // Se calcula la nota base 100
            let calificacionFinal = (respuestasCorrectasTotales / dbPreguntas.length) * 100;
            
            // Se llama a la función global que tengas expuesta en tu controlador-firebase.js
            // Asegúrate de que el nombre de esta función coincida con la que programaste (ej. guardarProgreso, registrarNota, etc.)
            if (typeof window.registrarResultadoPrueba === "function") {
                window.registrarResultadoPrueba({
                    materia: "Ciencias",
                    nivel: "6° Grado",
                    tema: "La Célula y los Niveles de Organización",
                    nota: calificacionFinal.toFixed(2),
                    aciertos: respuestasCorrectasTotales,
                    totalPreguntas: dbPreguntas.length
                });
            } else {
                console.warn("La prueba terminó, pero la función del controlador no fue encontrada en el entorno global.");
            }

            // Cambiamos el texto del botón al terminar
            const btnGrade = document.getElementById("btn-grade");
            btnGrade.textContent = `Prueba Finalizada - Nota: ${calificacionFinal.toFixed(0)}`;
            btnGrade.disabled = true;
            btnGrade.style.background = "#7f8c8d";
        }
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
