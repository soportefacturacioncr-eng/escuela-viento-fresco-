<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Español 3</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #f39c12; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #f1c40f; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #f39c12; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #f39c12; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #d35400; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #f39c12; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Comprensión de Lectura</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Qué es la 'Comprensión Lectora'?", "opciones": {"a": "La capacidad de leer muy rápido", "b": "Adquirir las ideas más importantes y vincularlas", "c": "Memorizar todas las palabras de un libro"}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "¿Cuántas ideas principales tiene un texto normalmente?", "opciones": {"a": "Solamente una", "b": "Tres o cuatro", "c": "Depende de la cantidad de páginas"}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "Si eliminamos la idea principal de un texto, ¿qué sucede?", "opciones": {"a": "El texto se entiende mejor", "b": "El texto pierde su valor y no se entiende", "c": "No sucede nada importante"}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "La idea principal siempre aparece escrita de forma exacta (textual) en el primer párrafo.", "opciones": {"a": "Verdadero", "b": "Falso", "c": "Solo en los cuentos cortos"}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "A las ideas que dan soporte, ejemplos o agregan información a la idea principal se les llama:", "opciones": {"a": "Ideas centrales", "b": "Ejes temáticos", "c": "Ideas complementarias o secundarias"}, "correcta": "c", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "¿Qué nombre recibe el 'hilo conductor' que agrupa las temáticas de un texto?", "opciones": {"a": "Idea principal", "b": "Ejes temáticos", "c": "Conclusión"}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "Lee el siguiente fragmento:\n'Los perros son excelentes mascotas. Ellos siempre se alegran de ver a sus dueños, protegen la casa de extraños y son muy cariñosos con los niños.'\n¿Cuál es la idea principal?", "opciones": {"a": "Los perros son excelentes mascotas.", "b": "Protegen la casa.", "c": "Son cariñosos con los niños."}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "Del fragmento anterior sobre los perros, ¿cuál de las siguientes es una idea complementaria?", "opciones": {"a": "Los perros son excelentes mascotas.", "b": "Ellos siempre se alegran de ver a sus dueños.", "c": "Los gatos son independientes."}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Cuál de las siguientes afirmaciones es correcta sobre las ideas complementarias?", "opciones": {"a": "Solo puede haber una en cada texto.", "b": "Pueden existir muchísimas en un mismo texto.", "c": "Son más importantes que la idea principal."}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "¿En qué parte del texto se puede encontrar la idea principal?", "opciones": {"a": "Solo al inicio", "b": "Solo al final", "c": "Al inicio, al final, o deducirse de la lectura"}, "correcta": "c", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "Cuando la idea principal NO está escrita textualmente, el lector debe:", "opciones": {"a": "Inventar una nueva idea", "b": "Deducirla (extraerla) a partir de la totalidad del escrito", "c": "Buscarla en un diccionario"}, "correcta": "b", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "Lee el siguiente texto:\n'El agua es vital para la supervivencia humana. Sin embargo, en muchas partes del mundo escasea debido a la contaminación y al cambio climático.'\nEl eje temático es:", "opciones": {"a": "La importancia del agua y su escasez", "b": "La supervivencia en el desierto", "c": "Las bebidas gaseosas"}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "Una característica clave de la idea principal es que:", "opciones": {"a": "Es el contenido sin el cual el texto no se entendería", "b": "Siempre es la oración más larga del texto", "c": "Solo da ejemplos y detalles menores"}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "Las ideas complementarias sirven para:", "opciones": {"a": "Reafirmar y dar soporte a la idea principal", "b": "Cambiar el tema del texto completamente", "c": "Confundir al lector para que preste atención"}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "En un cuento, la idea principal también puede estar relacionada con el:", "opciones": {"a": "Mensaje central que el autor quiere transmitir", "b": "Color del libro", "c": "Precio del texto"}, "correcta": "a", "explicacion": "Revisa los conceptos de comprensión de lectura en el resumen.<br><a href='resumen-espanol-3.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Escribe el nombre del tipo de idea que es la más importante de un texto (2 palabras):", "keywords": ["idea principal", "fundamental"], "explicacion": "Se llama Idea Principal o Fundamental."}, {"id": "q17", "type": "text", "pregunta": "Escribe el nombre del tipo de idea que sirve para dar ejemplos o afirmar lo que dice la idea principal (2 palabras):", "keywords": ["idea complementaria", "ideas complementarias", "ideas secundarias", "idea secundaria"], "explicacion": "Se llaman Ideas Complementarias o Secundarias."}, {"id": "q18", "type": "text", "pregunta": "Al hilo conductor que guía las temáticas del texto se le llama '_____ temático'.", "keywords": ["eje"], "explicacion": "Se le llama Eje Temático."}, {"id": "q19", "type": "text", "pregunta": "¿Cuántas ideas principales puede tener un texto?", "keywords": ["una", "1", "solo una"], "explicacion": "Todo texto tiene solo una idea principal."}, {"id": "q20", "type": "text", "pregunta": "Si la idea principal no está textual en el párrafo, el lector debe extraerla de la _________ del escrito.", "keywords": ["totalidad", "lectura total", "lectura"], "explicacion": "Se extrae de la totalidad del escrito."}, {"id": "q21", "type": "textarea", "pregunta": "Desarrollo: Explica con tus palabras la diferencia entre la Idea Principal y las Ideas Complementarias.", "keywords": [], "explicacion": "La idea principal es el mensaje central y más importante (solo hay una). Las ideas complementarias son los detalles, ejemplos o explicaciones que apoyan a esa idea principal (pueden ser muchas)."}, {"id": "q22", "type": "textarea", "pregunta": "Desarrollo: Lee este minitexto y escribe cuál es su idea principal:\n'Comer frutas todos los días es muy bueno para la salud. Aportan vitaminas necesarias para no enfermarnos, tienen mucha fibra que ayuda a la digestión y son deliciosas.'", "keywords": [], "explicacion": "La idea principal es: Comer frutas todos los días es muy bueno para la salud."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Del minitexto anterior sobre las frutas, escribe una Idea Complementaria.", "keywords": [], "explicacion": "Cualquier detalle: 'Aportan vitaminas' o 'Tienen mucha fibra' o 'Son deliciosas'."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: ¿Qué pasa si le quitamos las ideas complementarias a un texto? ¿Se sigue entendiendo? Justifica tu respuesta.", "keywords": [], "explicacion": "El texto se sigue entendiendo porque la idea principal es la que contiene el mensaje fundamental, aunque quede más corto y con menos detalles."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: ¿Por qué crees que es importante tener un 'Eje temático' o 'hilo conductor' cuando escribimos un cuento o un ensayo?", "keywords": [], "explicacion": "Es importante para no salirnos del tema, mantener un orden lógico y que el lector no se confunda."}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
