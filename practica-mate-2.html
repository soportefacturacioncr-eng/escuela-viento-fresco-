<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #e74c3c; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #e74c3c; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Estadística y Probabilidad</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- VINCULACIÓN AL CONTROLADOR DE FIREBASE DE LA PLATAFORMA -->
<script src="controlador-firebase.js"></script>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "En estadística, el dato que más se repite en un grupo se llama:", "opciones": {"a": "Mínimo", "b": "Promedio", "c": "Moda"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "Para calcular el 'Recorrido' (o rango) de un grupo de datos, debemos:", "opciones": {"a": "Restar el valor máximo menos el valor mínimo", "b": "Sumar todos los datos", "c": "Encontrar el que más se repite"}, "correcta": "a", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "En una bolsa oscura hay 5 bolas rojas. Si sacas una sin ver, el evento de 'sacar una bola roja' es:", "opciones": {"a": "Seguro", "b": "Imposible", "c": "Probable"}, "correcta": "a", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "Lanzar un dado normal de 6 caras y obtener el número 8 es un evento:", "opciones": {"a": "Seguro", "b": "Imposible", "c": "Poco probable"}, "correcta": "b", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "Si tienes las siguientes notas: 80, 90, 80, 100. ¿Cuál es la moda?", "opciones": {"a": "90", "b": "100", "c": "80"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "En un saco hay 3 bolas verdes y 10 bolas amarillas. Sacar una bola amarilla es un evento:", "opciones": {"a": "Muy probable", "b": "Seguro", "c": "Imposible"}, "correcta": "a", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "La suma de todos los datos dividida entre el número total de datos se llama:", "opciones": {"a": "Recorrido", "b": "Media aritmética (Promedio)", "c": "Moda"}, "correcta": "b", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "Las edades de un grupo son 10, 11, 10, 12, 10. ¿Cuál es el máximo?", "opciones": {"a": "10", "b": "11", "c": "12"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "En el grupo de edades anterior (10, 11, 10, 12, 10), ¿cuál es el mínimo?", "opciones": {"a": "10", "b": "11", "c": "12"}, "correcta": "a", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Al tirar una moneda al aire, sacar 'escudo' (o cara) es un evento:", "opciones": {"a": "Seguro", "b": "Probable", "c": "Imposible"}, "correcta": "b", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "Tienes un dado normal (1, 2, 3, 4, 5, 6). ¿Es más probable sacar un número par o un número impar?", "opciones": {"a": "Más probable número par", "b": "Más probable número impar", "c": "Tienen la misma probabilidad"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "En una bolsa hay 31 globos: 3 celestes, 7 blancos, 9 morados y 12 rosados. ¿Qué color es más probable sacar?", "opciones": {"a": "Celeste", "b": "Blanco", "c": "Rosado"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "Si calculas la media aritmética de 5 y 15, el resultado es:", "opciones": {"a": "10", "b": "20", "c": "5"}, "correcta": "a", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "Un evento 'Seguro' es aquel que tiene una probabilidad de ocurrir del:", "opciones": {"a": "0%", "b": "50%", "c": "100%"}, "correcta": "c", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "El concepto de 'Media aritmética' también es conocido popularmente como:", "opciones": {"a": "Máximo", "b": "Promedio", "c": "Recorrido"}, "correcta": "b", "explicacion": "Revisa los conceptos de estadística y probabilidad.<br><a href='resumen-mate-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Calcula el promedio de estos dos números: 10 y 20.", "keywords": ["15"], "explicacion": "(10 + 20) / 2 = 15."}, {"id": "q17", "type": "text", "pregunta": "¿Cuál es la moda en estos datos? 5, 2, 5, 3, 5, 1", "keywords": ["5", "cinco"], "explicacion": "El 5 se repite 3 veces, más que los demás."}, {"id": "q18", "type": "text", "pregunta": "Escribe el nombre del evento que NUNCA va a ocurrir (0% de probabilidad):", "keywords": ["imposible", "evento imposible"], "explicacion": "Imposible."}, {"id": "q19", "type": "text", "pregunta": "En un aula hay 15 niñas y 10 niños. Si rifan un premio, es más probable que lo gane una...", "keywords": ["niña", "nina"], "explicacion": "Hay más niñas que niños."}, {"id": "q20", "type": "text", "pregunta": "Calcula el recorrido (resta del máx - mín) de estos datos: 20, 30, 50, 10.", "keywords": ["40"], "explicacion": "El mayor es 50, el menor es 10. 50 - 10 = 40."}, {"id": "q21", "type": "text", "pregunta": "¿Cuál es el valor máximo en este grupo de datos? 5, 12, 3, 9, 21, 8", "keywords": ["21"], "explicacion": "21 es el número más grande."}, {"id": "q22", "type": "text", "pregunta": "Si un evento siempre, siempre ocurre (100%), se le llama evento...", "keywords": ["seguro", "evento seguro"], "explicacion": "No hay forma de que falle."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Tienes un dado normal de 6 caras. Escribe un ejemplo de un evento que sea IMPOSIBLE realizar con ese dado.", "keywords": [], "explicacion": "Cualquier cosa que no pueda salir, por ejemplo: Sacar un número 7, o sacar una letra 'A'."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: Explica paso a paso cómo harías para calcular la Media Aritmética (promedio) de tus notas en Matemáticas si te sacaste un 80, un 90 y un 100.", "keywords": [], "explicacion": "Paso 1: Sumar las notas (80+90+100 = 270). Paso 2: Dividir el total entre la cantidad de notas que son 3 (270 / 3 = 90). El promedio es 90."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: En una bolsa hay 10 confites de fresa y 1 confite de limón. Si metes la mano sin ver, ¿qué es más probable sacar y por qué?", "keywords": [], "explicacion": "Es más probable sacar un confite de fresa porque hay mucha mayor cantidad a favor (10) que de limón (solo 1)."}];
    
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta aquí (solo números si es el caso)...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        let todasFinalizadas = true;
        let correctas = 0;
        let erroresAcumulados = [];

        dbPreguntas.forEach((q, index) => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);

            if (!block.classList.contains('correct') && !block.classList.contains('locked')) {
                let esCorrecta = false;
                let respondida = false;

                if (q.type === 'mc') {
                    const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                    if (seleccion) { 
                        respondida = true; 
                        if (seleccion.value === q.correcta) esCorrecta = true; 
                    }
                } else if (q.type === 'text') {
                    const input = document.getElementById(q.id);
                    if (input.value.trim() !== '') {
                        respondida = true;
                        if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                    }
                } else if (q.type === 'textarea') {
                    const input = document.getElementById(q.id);
                    if (input.value.trim().length > 5) {
                        respondida = true;
                        esCorrecta = true; 
                    }
                }

                if (respondida) {
                    if (esCorrecta) {
                        block.classList.add('correct');
                        
                        // LIMPIEZA VISUAL
                        if (q.type !== 'textarea') {
                            block.style.display = 'none';
                        } else {
                            fb.className = 'feedback show feedback-correct';
                            fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                        }
                        
                        deshabilitar(q);
                    } else {
                        intentosPorPregunta[q.id]++;
                        if (intentosPorPregunta[q.id] >= 2) {
                            block.classList.add('locked', 'incorrect');
                            fb.className = 'feedback show feedback-error';
                            fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                            if (q.type === 'mc') {
                                document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                                document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                            }
                            deshabilitar(q);
                        } else {
                            fb.className = 'feedback show feedback-warning';
                            fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                        }
                    }
                }
            }

            if (block.classList.contains('correct')) {
                correctas++;
            } else if (block.classList.contains('locked')) {
                let textoError = `Pregunta ${index + 1}: ${q.pregunta.substring(0, 45)}...`;
                erroresAcumulados.push(textoError);
            } else {
                todasFinalizadas = false; 
            }
        });

        if (todasFinalizadas) {
            const btn = document.getElementById('btn-grade');
            if (btn.disabled) return; 

            const notaFinal = Math.round((correctas / dbPreguntas.length) * 100);
            const tituloMateria = document.title; 
            
            btn.innerText = "Enviando resultados a la profesora...";
            btn.disabled = true;
            btn.style.background = "#7f8c8d";

            enviarNota(tituloMateria, notaFinal, erroresAcumulados).then(exito => {
                if (exito) {
                    btn.innerText = `✅ Prueba Finalizada - Nota: ${notaFinal}`;
                    btn.style.background = "#27ae60";
                } else {
                    btn.innerText = "⚠️ Error al enviar (Toca para reintentar)";
                    btn.disabled = false;
                    btn.style.background = "#e74c3c";
                }
            });
        }
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
