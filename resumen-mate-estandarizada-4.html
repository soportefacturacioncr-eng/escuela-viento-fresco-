<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas Estandarizada 4 - Relaciones y Álgebra</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #ff7979; }
        
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; line-height: 1.5; }
        
        .table-q { width: 100%; max-width: 500px; border-collapse: collapse; margin: 15px 0; font-weight: normal; }
        .table-q th, .table-q td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        .table-q th { background-color: #ecf0f1; color: #2c3e50; }

        .figure-box { display: flex; justify-content: center; gap: 15px; margin: 15px 0; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap; text-align: center; font-size: 24px; }

        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Matemáticas: Relaciones y Álgebra</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script src="controlador-firebase.js" type="module"></script>

<script>
    const dbPreguntas = [
        {
            "id": "q1", 
            "type": "mc", 
            "pregunta": "María elabora collares con 36 perlas, siguiendo un patrón establecido. A continuación, se presenta el patrón de repetición del collar que está elaborando[cite: 6]:<br><br>" +
                        "<div class='figure-box'>⚪ - ⚫ - ⚫ - ⚪</div><br>" +
                        "De acuerdo con el patrón de esas primeras 4 perlas, las <strong>perlas 30 y 31</strong> son respectivamente:", 
            "opciones": {"a": "⚫ y ⚪", "b": "⚫ y ⚫", "c": "⚪ y ⚫", "d": "⚪ y ⚪"}, 
            "correcta": "b", 
            "explicacion": "El patrón es de 4 elementos. Para saber qué perla va en la posición 30, dividimos 30 ÷ 4 = 7 y sobran 2. La posición 2 del patrón es negra (⚫). Para la posición 31, dividimos 31 ÷ 4 = 7 y sobran 3. La posición 3 también es negra (⚫)[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q2", 
            "type": "mc", 
            "pregunta": "Considere la siguiente información[cite: 6]:<br>Un teatro tiene una ocupación máxima de 100 personas y el precio de la entrada por persona que se paga para ingresar a este es ₡2000. Las obras que se presentan en ese teatro tienen una <strong>duración entre 120 min y 130 min</strong>. Además, cada fila tiene 10 asientos.<br><br>De acuerdo con la información anterior, una cantidad <strong>variable</strong> corresponde:", 
            "opciones": {
                "a": "a la ocupación máxima del teatro.", 
                "b": "a la duración en minutos de las obras que se presentan.", 
                "c": "al precio de la entrada por persona.", 
                "d": "a la cantidad de asientos que tiene cada fila."
            }, 
            "correcta": "b", 
            "explicacion": "Una cantidad variable es aquella que puede cambiar. El precio, la capacidad máxima y los asientos son fijos (constantes), pero la duración de las obras varía (entre 120 y 130 minutos)[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q3", 
            "type": "mc", 
            "pregunta": "A una actividad deportiva asistieron 50 personas en total, de ellas 40 eran mujeres y el resto hombres[cite: 6].<br><br>¿Qué porcentaje, del total de personas que asistieron a esa actividad, corresponde a la cantidad de hombres?", 
            "opciones": {"a": "10%", "b": "20%", "c": "80%", "d": "90%"}, 
            "correcta": "b", 
            "explicacion": "Si hay 50 personas y 40 son mujeres, entonces hay 10 hombres. Para sacar el porcentaje, dividimos la cantidad de hombres entre el total y multiplicamos por 100: (10 ÷ 50) × 100 = 20%[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q4", 
            "type": "mc", 
            "pregunta": "En un parqueo hay motocicletas y automóviles. En la siguiente ecuación, <strong>\"n\"</strong> representa la cantidad de automóviles que hay en ese parqueo[cite: 6]:<br><br>" +
                        "<div class='figure-box'>20 + n = 60</div><br>" +
                        "De acuerdo con la ecuación, ¿cuántos automóviles hay en ese parqueo?", 
            "opciones": {"a": "3", "b": "40", "c": "80", "d": "1200"}, 
            "correcta": "b", 
            "explicacion": "Para resolver la ecuación, necesitamos dejar la \"n\" sola. El 20 que está sumando pasa al otro lado a restar: n = 60 - 20. Por lo tanto, n = 40[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q5", 
            "type": "mc", 
            "pregunta": "En una carrera de atletismo se ubicaron puestos de hidratación. La siguiente tabla muestra la distancia desde el inicio[cite: 6]:<br>" +
                        "<table class='table-q'><tr><th>Número de puesto</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>" +
                        "<tr><td>Distancia (en metros)</td><td>4 000</td><td>8 000</td><td>12 000</td><td>16 000</td><td>20 000</td><td>24 000</td></tr></table>" +
                        "Si se mantiene el patrón, ¿a qué distancia fue ubicado el <strong>puesto número 8</strong>?", 
            "opciones": {"a": "28 000", "b": "32 000", "c": "36 000", "d": "40 000"}, 
            "correcta": "b", 
            "explicacion": "El patrón es una sucesión donde se suman 4 000 metros por cada puesto (o se multiplica el número de puesto por 4 000). Puesto 8 × 4 000 = 32 000 metros[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q6", 
            "type": "mc", 
            "pregunta": "Si una máquina bombea 15 L de agua cada 3 min, entonces, ¿en cuántos minutos esa máquina bombeará 45 L de agua[cite: 6]?", 
            "opciones": {"a": "6", "b": "9", "c": "30", "d": "12"}, 
            "correcta": "b", 
            "explicacion": "Podemos aplicar una regla de tres (proporcionalidad). Si 15 L tardan 3 min, 45 L (que es el triple de 15) tardarán el triple de tiempo: 3 min × 3 = 9 minutos[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q7", 
            "type": "mc", 
            "pregunta": "La tabla muestra la cantidad de naranjas recolectadas diariamente en una finca[cite: 6]:<br>" +
                        "<table class='table-q'><tr><th>Día</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>" +
                        "<tr><td>Cantidad de naranjas</td><td>50</td><td>101</td><td>203</td><td>407</td><td>815</td><td>1631</td></tr></table>" +
                        "Si se mantuvo el patrón, ¿cuál fue la cantidad de naranjas recolectadas en el <strong>día siete</strong>?", 
            "opciones": {"a": "3261", "b": "3262", "c": "3263", "d": "3264"}, 
            "correcta": "c", 
            "explicacion": "El patrón consiste en multiplicar el número anterior por 2 y sumarle 1 (Ej: 50 × 2 + 1 = 101). Para el día 7: 1631 × 2 = 3262, y al sumarle 1 obtenemos 3263[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q8", 
            "type": "mc", 
            "pregunta": "Rebeca comenzó a leer un libro. El primer día leyó dos páginas, el segundo día leyó el triple de páginas que el primero, el tercer día leyó el triple del segundo, y así sucesivamente[cite: 6].<br><br>¿Cuántas páginas leyó Rebeca el <strong>quinto día</strong>?", 
            "opciones": {"a": "54", "b": "162", "c": "486", "d": "1458"}, 
            "correcta": "b", 
            "explicacion": "El patrón es multiplicar por 3. Día 1: 2. Día 2: 6 (2×3). Día 3: 18 (6×3). Día 4: 54 (18×3). Día 5: 162 (54×3)[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q9", 
            "type": "mc", 
            "pregunta": "Un tanque contiene un total de 225 litros de una mezcla de agua y aceite. En la siguiente ecuación, <strong>\"m\"</strong> representa la cantidad de litros de agua[cite: 6]:<br><br>" +
                        "<div class='figure-box'>75 + m = 225</div><br>" +
                        "¿De cuántos litros de agua está conformada la mezcla?", 
            "opciones": {"a": "3", "b": "150", "c": "300", "d": "75"}, 
            "correcta": "b", 
            "explicacion": "Para resolver la ecuación y hallar \"m\", pasamos el 75 a restar al otro lado: m = 225 - 75. El resultado es m = 150 litros[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q10", 
            "type": "mc", 
            "pregunta": "En una pulpería hay 360 huevos empacados en cartones. Cada cartón contiene la misma cantidad. En la siguiente ecuación, <strong>\"n\"</strong> representa la cantidad de cartones[cite: 6]:<br><br>" +
                        "<div class='figure-box'>30 x n = 360</div><br>" +
                        "¿Cuál es la cantidad de cartones de huevos que hay en esa pulpería?", 
            "opciones": {"a": "12", "b": "330", "c": "390", "d": "30"}, 
            "correcta": "a", 
            "explicacion": "Para dejar la \"n\" sola, pasamos el 30 (que está multiplicando) al otro lado a dividir: n = 360 ÷ 30. Al hacer la división, n = 12 cartones[cite: 6].<br><a href='resumen-mate-estandarizada-4.html' class='btn-review'>📖 Leer Resumen</a>"
        }
    ];

    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key.toUpperCase()}) ${value}</label>`;
                }
                html += `</div>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function calificarPrueba() {
        let respuestasCorrectasTotales = 0;
        let preguntasCompletadas = 0;

        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            
            if (block.classList.contains('correct') || block.classList.contains('locked')) {
                if (block.classList.contains('correct')) respuestasCorrectasTotales++;
                preguntasCompletadas++;
                return;
            }

            let esCorrecta = false;
            let respondida = false;

            const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
            if (seleccion) { 
                respondida = true; 
                if (seleccion.value === q.correcta) esCorrecta = true; 
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                deshabilitar(q);
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    deshabilitar(q);
                    preguntasCompletadas++;
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });

        if (preguntasCompletadas === dbPreguntas.length) {
            let calificacionFinal = (respuestasCorrectasTotales / dbPreguntas.length) * 100;
            
            if (typeof window.registrarResultadoPrueba === "function") {
                window.registrarResultadoPrueba({
                    materia: "Matemáticas",
                    nivel: "6° Grado",
                    tema: "Relaciones y Álgebra",
                    nota: calificacionFinal.toFixed(2),
                    aciertos: respuestasCorrectasTotales,
                    totalPreguntas: dbPreguntas.length
                });
            }

            const btnGrade = document.getElementById("btn-grade");
            btnGrade.textContent = `Prueba Finalizada - Nota: ${calificacionFinal.toFixed(0)}`;
            btnGrade.disabled = true;
            btnGrade.style.background = "#7f8c8d";
        }
    }

    function deshabilitar(q) {
        document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
