<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas 5</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #e74c3c; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #e74c3c; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Geometría: Cuerpos Geométricos 3D</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Cuál cuerpo geométrico tiene dos bases circulares y una superficie lateral curva?", "opciones": {"a": "Prisma", "b": "Cono", "c": "Cilindro"}, "correcta": "c", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "¿Qué cuerpo geométrico tiene una sola base poligonal y sus caras laterales son triángulos?", "opciones": {"a": "Prisma", "b": "Pirámide", "c": "Esfera"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "¿Cómo se llama el punto o 'esquina' donde se unen varias aristas?", "opciones": {"a": "Base", "b": "Vértice", "c": "Arista"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "¿Qué nombre recibe la línea o borde donde se unen dos caras de un cuerpo geométrico?", "opciones": {"a": "Arista", "b": "Vértice", "c": "Lado"}, "correcta": "a", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "Un cubo (como un dado) es un ejemplo especial de:", "opciones": {"a": "Cilindro", "b": "Prisma", "c": "Pirámide"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "Una lata de atún tradicional tiene forma de:", "opciones": {"a": "Prisma circular", "b": "Cilindro", "c": "Cono"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "¿Cuántas bases tiene un prisma?", "opciones": {"a": "Una", "b": "Dos", "c": "Cuatro"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "¿Cuántas bases tiene un cono?", "opciones": {"a": "Una", "b": "Dos", "c": "Ninguna"}, "correcta": "a", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "Un cuerpo completamente curvo sin caras planas, vértices ni aristas es:", "opciones": {"a": "Cilindro", "b": "Esfera", "c": "Círculo"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Las famosas construcciones antiguas de Egipto son ejemplos de:", "opciones": {"a": "Pirámides", "b": "Prismas triangulares", "c": "Conos cuadrados"}, "correcta": "a", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "¿Qué forma geométrica tienen siempre las caras laterales de un prisma (si no es un cubo)?", "opciones": {"a": "Triángulos", "b": "Rectángulos o paralelogramos", "c": "Círculos"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "¿Qué forma geométrica tienen siempre las caras laterales de una pirámide?", "opciones": {"a": "Rectángulos", "b": "Cuadrados", "c": "Triángulos"}, "correcta": "c", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "A la cara inferior sobre la cual normalmente 'descansa' un cuerpo geométrico se le llama:", "opciones": {"a": "Base", "b": "Cúspide", "c": "Cara lateral"}, "correcta": "a", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "Un típico gorrito de fiesta de cumpleaños tiene forma de:", "opciones": {"a": "Cono", "b": "Pirámide", "c": "Cilindro"}, "correcta": "a", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "¿Qué cuerpo geométrico se parece a un tubo de papel higiénico?", "opciones": {"a": "Prisma rectangular", "b": "Cilindro", "c": "Esfera"}, "correcta": "b", "explicacion": "Revisa los elementos de los cuerpos geométricos.<br><a href='resumen-mate-5.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Escribe el nombre del cuerpo 3D que parece una pelota perfecta:", "keywords": ["esfera"], "explicacion": "Es la esfera."}, {"id": "q17", "type": "text", "pregunta": "¿Cómo se le llama a la 'esquina' aguda de un cuerpo geométrico?", "keywords": ["vertice", "vértice"], "explicacion": "Vértice."}, {"id": "q18", "type": "text", "pregunta": "Escribe el nombre de la línea donde se unen dos caras planas:", "keywords": ["arista"], "explicacion": "Arista."}, {"id": "q19", "type": "text", "pregunta": "¿Qué figura plana es la base de un cilindro?", "keywords": ["circulo", "círculo"], "explicacion": "El cilindro tiene dos bases circulares."}, {"id": "q20", "type": "text", "pregunta": "¿Cuántas bases tiene una pirámide? (Escribe el número o la palabra)", "keywords": ["1", "una"], "explicacion": "Las pirámides solo tienen 1 base."}, {"id": "q21", "type": "textarea", "pregunta": "Desarrollo: Explica la diferencia principal entre un Prisma y una Pirámide.", "keywords": [], "explicacion": "El prisma tiene dos bases iguales y sus caras laterales son rectángulos. La pirámide tiene solo una base y sus caras laterales son triángulos que terminan en una punta."}, {"id": "q22", "type": "textarea", "pregunta": "Desarrollo: Escribe el nombre de 3 objetos de la vida real que tengan forma de cilindro.", "keywords": [], "explicacion": "Ejemplos válidos: una lata de atún, un estañón de agua, un tubo de PVC, un vaso recto, una batería (pila)."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: ¿Por qué podemos decir que una esfera no tiene aristas ni vértices?", "keywords": [], "explicacion": "Porque es una superficie completamente curva y continua, no tiene caras planas que se unan para formar líneas (aristas) ni esquinas puntiagudas (vértices)."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: ¿Cuál es la diferencia entre un Círculo y una Esfera?", "keywords": [], "explicacion": "El círculo es una figura plana (2D), como un dibujo en un papel. La esfera es un cuerpo geométrico con volumen (3D), como una bola."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: Imagina una caja de zapatos. ¿Qué tipo de cuerpo geométrico es y por qué?", "keywords": [], "explicacion": "Es un prisma rectangular, porque tiene dos bases rectangulares (arriba y abajo) y sus 4 caras laterales también son rectángulos."}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 3) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
