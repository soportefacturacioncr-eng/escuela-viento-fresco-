<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Español 4</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #f39c12; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #f1c40f; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #f39c12; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #f39c12; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #d35400; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #f39c12; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Análisis de Personajes</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Qué es el 'conflicto de los personajes' en una historia?", "opciones": {"a": "Cuando los personajes se hacen amigos", "b": "Cuando el protagonista no puede lograr lo que desea debido a un obstáculo", "c": "Cuando el texto no tiene idea principal"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "Al personaje principal que intenta lograr un deseo se le llama:", "opciones": {"a": "Antagonista", "b": "Narrador", "c": "Protagonista"}, "correcta": "c", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "Al personaje que se opone o crea obstáculos para el principal se le conoce como:", "opciones": {"a": "Protagonista", "b": "Antagonista", "c": "Eje temático"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "La personalidad de un personaje está formada por:", "opciones": {"a": "Su ropa y sus zapatos", "b": "Un conjunto de características emocionales y actitudes", "c": "Solo las cosas que dice en voz alta"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "Si un personaje huye y se esconde ante un peligro, su comportamiento demuestra:", "opciones": {"a": "Valentía", "b": "Cobardía o miedo", "c": "Alegría"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "Para identificar el conflicto de un personaje, lo primero que debemos hacer es:", "opciones": {"a": "Identificar sus deseos y necesidades", "b": "Contar cuántas palabras tiene el cuento", "c": "Dibujarlo en el cuaderno"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "¿Cómo nos damos cuenta del comportamiento o personalidad de un personaje en un texto?", "opciones": {"a": "Viendo cómo actúa y cómo se relaciona con los demás", "b": "Leyendo solo el título", "c": "Buscando palabras homófonas"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "Si un personaje decide enfrentar a un dragón para salvar a su pueblo, su característica principal es:", "opciones": {"a": "Ser malhumorado", "b": "Ser valiente y compasivo", "c": "Ser perezoso"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Qué sucede cuando el protagonista se enfrenta al antagonista?", "opciones": {"a": "Se genera un problema o conflicto que deben resolver", "b": "El cuento termina inmediatamente", "c": "Se convierten en la idea principal"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Identificar cómo reacciona un personaje ante un problema nos ayuda a:", "opciones": {"a": "Conocer su personalidad", "b": "Saber en qué año se escribió el texto", "c": "Mejorar nuestra ortografía"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "En el cuento de Caperucita Roja, ¿quién es el antagonista que crea el conflicto?", "opciones": {"a": "La abuelita", "b": "El leñador", "c": "El lobo feroz"}, "correcta": "c", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "¿Cuál de estos NO es un paso recomendado para identificar el comportamiento de un personaje?", "opciones": {"a": "Observar si es valiente o cobarde", "b": "Relacionar lo que hace con su personalidad", "c": "Aprenderse el texto de memoria sin analizarlo"}, "correcta": "c", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "El comportamiento de un personaje afecta el desarrollo de la historia.", "opciones": {"a": "Verdadero", "b": "Falso", "c": "Solo si el texto es muy largo"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "¿Qué es un atributo simbólico en un personaje?", "opciones": {"a": "Un objeto o actitud que representa su forma de ser (ej: una varita para una hada)", "b": "Una falta de ortografía", "c": "El número de página donde aparece"}, "correcta": "a", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "Un personaje malhumorado probablemente reaccionará ante un problema:", "opciones": {"a": "Con paciencia", "b": "Con enojo o agresividad", "c": "Cantando feliz"}, "correcta": "b", "explicacion": "Revisa los conceptos de análisis de personajes.<br><a href='resumen-espanol-4.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Personaje principal de una historia que busca cumplir un deseo:", "keywords": ["protagonista"], "explicacion": "Es el héroe o personaje central."}, {"id": "q17", "type": "text", "pregunta": "Personaje que se opone o le pone obstáculos al protagonista:", "keywords": ["antagonista"], "explicacion": "Es el rival o villano."}, {"id": "q18", "type": "text", "pregunta": "Situación que se genera cuando el protagonista no puede lograr lo que desea:", "keywords": ["conflicto", "problema"], "explicacion": "El conflicto es el motor de la historia."}, {"id": "q19", "type": "text", "pregunta": "El conjunto de características emocionales de un personaje define su...", "keywords": ["personalidad", "comportamiento"], "explicacion": "La personalidad guía sus acciones."}, {"id": "q20", "type": "text", "pregunta": "Si un personaje comparte su comida con alguien que tiene hambre, su personalidad es...", "keywords": ["compasivo", "bueno", "amable", "generoso", "compasiva", "solidario"], "explicacion": "Demuestra bondad o compasión."}, {"id": "q21", "type": "textarea", "pregunta": "Desarrollo: Explica qué es un 'conflicto' en una historia usando el ejemplo de un cuento que conozcas (como Los Tres Cerditos o Cenicienta).", "keywords": [], "explicacion": "En Los Tres Cerditos, el conflicto es que los cerditos quieren vivir tranquilos (protagonistas) pero el lobo (antagonista) quiere comérselos y les destruye las casas."}, {"id": "q22", "type": "textarea", "pregunta": "Desarrollo: Inventa un protagonista y un antagonista. Describe brevemente cuál sería el conflicto entre ellos.", "keywords": [], "explicacion": "Ejemplo: Un niño que quiere ganar un torneo de fútbol (protagonista) y otro jugador que hace trampa para evitar que gane (antagonista)."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Lee el siguiente texto: 'Mario vio que la casa se quemaba. Sin pensarlo dos veces, corrió hacia adentro para salvar a un perrito atrapado.' ¿Qué nos dice esta acción sobre el comportamiento y la personalidad de Mario?", "keywords": [], "explicacion": "Nos dice que Mario es una persona muy valiente, arriesgada y compasiva, porque puso su vida en peligro por ayudar a otro ser vivo."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: ¿Por qué crees que es importante que una historia tenga un antagonista o una circunstancia difícil?", "keywords": [], "explicacion": "Porque si todo fuera fácil y perfecto, no habría conflicto, la historia sería aburrida y el protagonista no tendría oportunidad de demostrar su personalidad o resolver problemas."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: Describe la personalidad de un personaje que reacciona huyendo y llorando ante un problema.", "keywords": [], "explicacion": "Es un personaje miedoso, cobarde o inseguro, que no sabe cómo enfrentar las dificultades de frente."}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
