<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas Estandarizada 2 - Geometría</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #ff7979; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        
        /* Estilos para las figuras ilustrativas */
        .figure-box { display: flex; justify-content: center; gap: 15px; margin: 15px 0; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap; text-align: center; }
        .figure-item { background: white; padding: 10px; border-radius: 6px; border: 1px solid #ccc; min-width: 90px; }
        
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Matemáticas: Geometría</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- Enlace al controlador de Firebase -->
<script src="controlador-firebase.js" type="module"></script>

<script>
    const dbPreguntas = [
        {
            "id": "q1",
            "type": "mc",
            "pregunta": "Considere las siguientes figuras que corresponden a la superficie de cuatro jardines[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<div class='figure-item'><strong>Figura I</strong><svg width='80' height='50'><polygon points='10,40 25,10 55,10 70,40' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura II</strong><svg width='80' height='50'><rect x='10' y='10' width='60' height='30' fill='none' stroke='#333' stroke-width='2'/><rect x='10' y='10' width='8' height='8' fill='none' stroke='#333'/><rect x='62' y='10' width='8' height='8' fill='none' stroke='#333'/><rect x='10' y='32' width='8' height='8' fill='none' stroke='#333'/><rect x='62' y='32' width='8' height='8' fill='none' stroke='#333'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura III</strong><svg width='80' height='50'><polygon points='10,20 70,10 70,40 10,40' fill='none' stroke='#333' stroke-width='2'/><rect x='62' y='32' width='8' height='8' fill='none' stroke='#333'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura IV</strong><svg width='80' height='50'><polygon points='20,15 65,10 75,45 10,35' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "</div>\n" +
                        "¿Cuál de esas figuras corresponde a un paralelogramo[cite: 4]?",
            "opciones": {"a": "Figura I", "b": "Figura II", "c": "Figura III", "d": "Figura IV"},
            "correcta": "b",
            "explicacion": "La Figura II corresponde a un paralelogramo (rectángulo) que posee sus ángulos interiores rectos ($90^\\circ$) y lados opuestos paralelos e iguales[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q2",
            "type": "mc",
            "pregunta": "Considere la siguiente figura que representa a un envase de un perfume[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='80' height='100'><ellipse cx='40' cy='20' rx='30' ry='10' fill='none' stroke='#333' stroke-width='2'/><line x1='10' y1='20' x2='10' y2='80' stroke='#333' stroke-width='2'/><line x1='70' y1='20' x2='70' y2='80' stroke='#333' stroke-width='2'/><ellipse cx='40' cy='80' rx='30' ry='10' fill='none' stroke='#333' stroke-width='2' stroke-dasharray='4'/></svg>" +
                        "</div>\n" +
                        "De acuerdo con la información anterior, la forma que tiene el envase de ese perfume podría corresponder al cuerpo sólido denominado[cite: 4]:",
            "opciones": {"a": "Cubo", "b": "Cilindro", "c": "Prisma rectangular", "d": "Pirámide"},
            "correcta": "b",
            "explicacion": "El cuerpo geométrico con dos bases circulares paralelas y una superficie lateral curva es el cilindro[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q3",
            "type": "mc",
            "pregunta": "Karla desea colocar una cinta decorativa alrededor de un mantel rectangular[cite: 4]. Si la medida del largo de ese mantel es 100 cm y la del ancho es 50 cm, entonces ¿cuántos centímetros de esa cinta, como mínimo, necesita comprar[cite: 4]?",
            "opciones": {"a": "150", "b": "300", "c": "500", "d": "5000"},
            "correcta": "b",
            "explicacion": "Para hallar la cinta alrededor del mantel se calcula el perímetro del rectángulo: $P = 2 \\times (100 + 50) = 300\\text{ cm}$[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q4",
            "type": "mc",
            "pregunta": "En el siguiente sistema de coordenadas se representa la figura de una ventana y los puntos (P, T, R y H) donde se colocaron tornillos[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='140' height='90'><polygon points='30,70 50,30 90,30 110,70' fill='#e2e8f0' stroke='#333' stroke-width='2'/><circle cx='50' cy='30' r='4' fill='black'/><text x='45' y='22' font-size='12'>P</text><circle cx='90' cy='30' r='4' fill='black'/><text x='95' y='22' font-size='12'>T</text><circle cx='110' cy='70' r='4' fill='black'/><text x='115' y='75' font-size='12'>R</text><circle cx='30' cy='70' r='4' fill='black'/><text x='15' y='75' font-size='12'>H</text></svg>" +
                        "</div>\n" +
                        "La medida del lado de cada cuadrado de la cuadrícula es 10 cm[cite: 4]. ¿Cuántos ejes de simetría tiene esa figura[cite: 4]?",
            "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"},
            "correcta": "a",
            "explicacion": "Un trapecio isósceles estándar posee únicamente 1 eje de simetría vertical que divide la figura en dos partes idénticas[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q5",
            "type": "mc",
            "pregunta": "Ubicación de la casa de Ana (A), Jorge (J), Guillermo (G), Rocío (R) y Tatiana (T) en un sistema de coordenadas[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='160' height='120'><text x='10' y='15' font-size='11'>Norte ⬆</text><text x='110' y='110' font-size='11'>Este ➡</text><circle cx='30' cy='80' r='4' fill='black'/><text x='35' y='85' font-size='12'>A</text><circle cx='60' cy='40' r='4' fill='black'/><text x='65' y='45' font-size='12'>J</text><circle cx='80' cy='60' r='4' fill='black'/><text x='85' y='65' font-size='12'>T</text><circle cx='80' cy='105' r='4' fill='black'/><text x='85' y='105' font-size='12'>R</text><circle cx='130' cy='80' r='4' fill='black'/><text x='135' y='85' font-size='12'>G</text></svg>" +
                        "</div>\n" +
                        "La medida del lado de cada cuadrado de la cuadrícula es 100 m[cite: 4]. Si Ana (A) sale de su casa y camina 300 m al este y 200 m al norte, llega a la casa de[cite: 4]:",
            "opciones": {"a": "Jorge", "b": "Rocío", "c": "Tatiana", "d": "Guillermo"},
            "correcta": "c",
            "explicacion": "Partiendo de Ana (A) y desplazándose 3 unidades a la derecha y 2 hacia arriba, se llega exactamente a la casa de Tatiana (T)[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q6",
            "type": "mc",
            "pregunta": "Señales de tránsito formadas por líneas[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<div class='figure-item'><strong>Figura I</strong><svg width='50' height='45'><polygon points='25,5 45,40 5,40' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura II</strong><svg width='50' height='45'><polygon points='15,5 35,5 45,15 45,30 35,40 15,40 5,30 5,15' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura III</strong><svg width='50' height='45'><path d='M10,35 L10,20 Q10,10 20,10 L35,10 M30,5 L40,10 L30,15' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "<div class='figure-item'><strong>Figura IV</strong><svg width='50' height='45'><polygon points='25,5 45,15 45,35 25,45 5,35 5,15' fill='none' stroke='#333' stroke-width='2'/></svg></div>" +
                        "</div>\n" +
                        "¿Cuál de esas figuras NO corresponde a un polígono[cite: 4]?",
            "opciones": {"a": "Figura I", "b": "Figura II", "c": "Figura III", "d": "Figura IV"},
            "correcta": "c",
            "explicacion": "Un polígono está formado exclusivamente por segmentos de recta cerrados. La Figura III contiene líneas curvas, por lo que no es un polígono[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q7",
            "type": "mc",
            "pregunta": "Cuadrado que representa el piso de un dormitorio de 5 m por lado[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='60' height='60'><rect x='5' y='5' width='50' height='50' fill='none' stroke='#333' stroke-width='2'/><text x='20' y='35' font-size='12'>5 m</text></svg>" +
                        "</div>\n" +
                        "Si se requiere colocar cerámica en la totalidad del piso, ¿cuántos metros cuadrados se requieren[cite: 4]?",
            "opciones": {"a": "10", "b": "20", "c": "25", "d": "5"},
            "correcta": "c",
            "explicacion": "El área de un cuadrado se calcula multiplicando lado por lado: $5\\text{ m} \\times 5\\text{ m} = 25\\text{ m}^2$[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q8",
            "type": "mc",
            "pregunta": "Senderos de una reserva biológica (de ida y de regreso en forma de paralelogramo)[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='220' height='80'><polygon points='30,60 70,20 180,20 140,60' fill='none' stroke='#333' stroke-width='2'/><text x='15' y='65' font-size='10'>Entrada</text><text x='80' y='15' font-size='10'>750 m</text><text x='185' y='25' font-size='10'>Mirador</text></svg>" +
                        "</div>\n" +
                        "De acuerdo con la información anterior, el recorrido realizado por el sendero de ida es[cite: 4]:",
            "opciones": {"a": "igual que el recorrido por el sendero de regreso.", "b": "mayor que el recorrido por el sendero de regreso.", "c": "menor que el recorrido por el sendero de regreso.", "d": "diferente al recorrido por el sendero de regreso."},
            "correcta": "a",
            "explicacion": "Por propiedad de los paralelogramos, los lados opuestos que conforman los trayectos de ida y de regreso tienen la misma longitud[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q9",
            "type": "mc",
            "pregunta": "Forma de los jardines P, Q, R y T en una cuadrícula (lado = 1 m)[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<div class='figure-item'><strong>P</strong><svg width='50' height='40'><polygon points='5,35 5,5 35,5 45,35' fill='#cbd5e1'/></svg></div>" +
                        "<div class='figure-item'><strong>Q</strong><svg width='50' height='40'><polygon points='10,10 40,5 40,35 10,25' fill='#cbd5e1'/></svg></div>" +
                        "<div class='figure-item'><strong>R</strong><svg width='50' height='40'><polygon points='5,35 20,10 45,25 45,35' fill='#cbd5e1'/></svg></div>" +
                        "<div class='figure-item'><strong>T</strong><svg width='50' height='40'><rect x='5' y='10' width='40' height='25' fill='#cbd5e1'/></svg></div>" +
                        "</div>\n" +
                        "¿Cuáles de esos jardines tienen forma de trapecio[cite: 4]?",
            "opciones": {"a": "P y Q", "b": "Q y R", "c": "P y R", "d": "P y T"},
            "correcta": "a",
            "explicacion": "Los cuadriláteros P y Q tienen exactamente un par de lados paralelos, cumpliendo con la definición de trapecio[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q10",
            "type": "mc",
            "pregunta": "La superficie de una mesa tiene forma cuadrada con un perímetro de 12 m[cite: 4]. ¿Cuántos metros cuadrados de plástico adhesivo se requieren para cubrir la superficie[cite: 4]?",
            "opciones": {"a": "12", "b": "9", "c": "6", "d": "16"},
            "correcta": "b",
            "explicacion": "Cada lado mide $12 \\div 4 = 3\\text{ m}$. El área se obtiene multiplicando lado por lado: $3 \\times 3 = 9\\text{ m}^2$[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q11",
            "type": "mc",
            "pregunta": "Figura simétrica de un árbol en un sistema de coordenadas (lado de cuadrícula = 10 cm)[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='120' height='90'><polygon points='60,10 80,40 70,40 90,70 40,70 60,40 50,40' fill='#e2e8f0' stroke='#333'/><circle cx='40' cy='40' r='3' fill='black'/><text x='25' y='43' font-size='10'>G</text><circle cx='80' cy='40' r='3' fill='black'/><text x='88' y='43' font-size='10'>C</text><circle cx='45' cy='70' r='3' fill='black'/><text x='35' y='82' font-size='10'>F</text><circle cx='75' cy='70' r='3' fill='black'/><text x='78' y='82' font-size='10'>D</text></svg>" +
                        "</div>\n" +
                        "De acuerdo con la información, ¿cuáles puntos son homólogos entre sí respecto al eje de simetría[cite: 4]?",
            "opciones": {"a": "F y G", "b": "D y C", "c": "F y D", "d": "G y D"},
            "correcta": "c",
            "explicacion": "Los puntos homólogos se ubican a la misma distancia y dirección opuesta respecto al eje central; los puntos F y D se corresponden simétricamente en la base inferior[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        },
        {
            "id": "q12",
            "type": "mc",
            "pregunta": "Frente de una casa compuesta por las figuras 1, 2, 3 y 4[cite: 4]:\n\n" +
                        "<div class='figure-box'>" +
                        "<svg width='120' height='80'><polygon points='10,35 60,10 110,35' fill='none' stroke='#333' stroke-width='2'/><rect x='15' y='35' width='80' height='40' fill='none' stroke='#333' stroke-width='2'/><text x='45' y='60' font-size='14'>2</text></svg>" +
                        "</div>\n" +
                        "¿Cuál de esas figuras geométricas corresponde a un rectángulo[cite: 4]?",
            "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"},
            "correcta": "b",
            "explicacion": "La sección número 2 corresponde a la base de la casa, la cual tiene forma rectangular con cuatro ángulos rectos[cite: 4].<br><a href='resumen-mate-estandarizada-2.html' class='btn-review'>📖 Leer Resumen</a>"
        }
    ];

    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key.toUpperCase()}) ${value}</label>`;
                }
                html += `</div>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function calificarPrueba() {
        let respuestasCorrectasTotales = 0;
        let preguntasCompletadas = 0;

        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            
            if (block.classList.contains('correct') || block.classList.contains('locked')) {
                if (block.classList.contains('correct')) respuestasCorrectasTotales++;
                preguntasCompletadas++;
                return;
            }

            let esCorrecta = false;
            let respondida = false;

            const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
            if (seleccion) { 
                respondida = true; 
                if (seleccion.value === q.correcta) esCorrecta = true; 
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                deshabilitar(q);
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    deshabilitar(q);
                    preguntasCompletadas++;
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });

        if (preguntasCompletadas === dbPreguntas.length) {
            let calificacionFinal = (respuestasCorrectasTotales / dbPreguntas.length) * 100;
            
            if (typeof window.registrarResultadoPrueba === "function") {
                window.registrarResultadoPrueba({
                    materia: "Matemáticas",
                    nivel: "6° Grado",
                    tema: "Geometría",
                    nota: calificacionFinal.toFixed(2),
                    aciertos: respuestasCorrectasTotales,
                    totalPreguntas: dbPreguntas.length
                });
            }

            const btnGrade = document.getElementById("btn-grade");
            btnGrade.textContent = `Prueba Finalizada - Nota: ${calificacionFinal.toFixed(0)}`;
            btnGrade.disabled = true;
            btnGrade.style.background = "#7f8c8d";
        }
    }

    function deshabilitar(q) {
        document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
