<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Ciencias 6</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #1abc9c; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #3498db; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: #2980b9; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #2471a3; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #27ae60; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Práctica #6: Exploración Espacial</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "Teoría que afirma que el universo nació de una gran explosión a partir de un punto superdenso y caliente:", "opciones": {"a": "Teoría Nebular", "b": "Teoría del Universo Oscilante", "c": "Teoría del Big Bang"}, "correcta": "c", "explicacion": "El Big Bang es el modelo cosmológico más aceptado hoy en día.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "text", "pregunta": "Movimiento de la Tierra girando sobre su propio eje imaginario, causando el día y la noche:", "keywords": ["rotacion", "rotación"], "explicacion": "La rotación dura aproximadamente 24 horas.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "¿Cómo se llama la teoría que explica la formación de nuestro Sistema Solar a partir de una nube de gas y polvo?", "opciones": {"a": "Teoría de la Relatividad", "b": "Teoría Nebular", "c": "Teoría del Big Crunch"}, "correcta": "b", "explicacion": "La Teoría Nebular explica la formación del Sol y los planetas.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "El movimiento de la Tierra alrededor del Sol en una órbita elíptica se denomina:", "opciones": {"a": "Rotación", "b": "Traslación", "c": "Precesión"}, "correcta": "b", "explicacion": "La traslación define la duración del año (365 días).<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "text", "pregunta": "En qué fase se encuentra la luna cuando la Tierra se interpone exactamente entre el Sol y ella, permitiéndonos verla totalmente iluminada:", "keywords": ["luna llena", "llena"], "explicacion": "Al no estar tapada, el Sol la ilumina por completo desde nuestra perspectiva.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "Cuando la Luna se interpone exactamente entre el Sol y la Tierra, tapando la luz del sol, ocurre un:", "opciones": {"a": "Eclipse lunar", "b": "Eclipse solar", "c": "Solsticio"}, "correcta": "b", "explicacion": "El eclipse solar ocurre en fase de Luna Nueva.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "Es un movimiento de la Tierra que se asemeja al bamboleo de un trompo al ir perdiendo velocidad:", "opciones": {"a": "Traslación", "b": "Nutación", "c": "Precesión"}, "correcta": "c", "explicacion": "La precesión de los equinoccios cambia lentamente hacia dónde apunta el eje de la Tierra.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "text", "pregunta": "Aparatos enviados al espacio y que orbitan la Tierra para darnos internet, GPS y pronósticos del clima:", "keywords": ["satelites", "satélite", "satelite", "satelites artificiales"], "explicacion": "Los satélites artificiales son fundamentales en nuestra vida diaria.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Qué es un eclipse lunar?", "opciones": {"a": "Cuando el Sol se pone entre la Tierra y la Luna", "b": "Cuando la Tierra bloquea la luz del Sol, proyectando su sombra sobre la Luna", "c": "Cuando un planeta choca con la Luna"}, "correcta": "b", "explicacion": "Ocurre únicamente durante la fase de Luna Llena.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Pequeña vibración o temblor en el eje de la Tierra mientras realiza el movimiento de precesión:", "opciones": {"a": "Nutación", "b": "Rotación", "c": "Traslación"}, "correcta": "a", "explicacion": "La nutación es un movimiento microscópico en el eje.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "text", "pregunta": "Naves espaciales no tripuladas (sin humanos) enviadas a otros planetas para investigarlos y enviar datos a la Tierra:", "keywords": ["sonda", "sondas", "sondas espaciales", "sonda espacial"], "explicacion": "Ejemplo: Las sondas Voyager o los Rovers en Marte.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "El primer ser humano en viajar al espacio exterior fue el cosmonauta soviético:", "opciones": {"a": "Neil Armstrong", "b": "Yuri Gagarin", "c": "Buzz Aldrin"}, "correcta": "b", "explicacion": "Yuri Gagarin orbitó la Tierra en 1961 en la nave Vostok 1.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "¿Por qué los telescopios espaciales (como el James Webb) toman mejores fotos que los telescopios en la Tierra?", "opciones": {"a": "Porque son más pequeños", "b": "Porque la gravedad en el espacio es mayor", "c": "Porque no tienen la interferencia de las nubes y la atmósfera terrestre"}, "correcta": "c", "explicacion": "La atmósfera distorsiona la luz de las estrellas, en el espacio no existe ese problema.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "text", "pregunta": "Nombre de la galaxia en forma de espiral en la cual se encuentra nuestro Sistema Solar:", "keywords": ["via lactea", "vía láctea"], "explicacion": "La Vía Láctea alberga miles de millones de estrellas, incluyendo nuestro Sol.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "Durante la traslación terrestre, ¿qué consecuencia directa ocurre en los polos y zonas templadas del planeta?", "opciones": {"a": "Las estaciones del año (verano, invierno, etc.)", "b": "Los tsunamis", "c": "El día y la noche"}, "correcta": "a", "explicacion": "La traslación sumada a la inclinación del eje terrestre generan las estaciones.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "mc", "pregunta": "¿Cuál es el planeta más grande de nuestro Sistema Solar?", "opciones": {"a": "Saturno", "b": "Júpiter", "c": "La Tierra"}, "correcta": "b", "explicacion": "Júpiter es un gigante gaseoso, el más grande del sistema.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q17", "type": "text", "pregunta": "La fuerza invisible que mantiene a los planetas girando en órbita alrededor del Sol se llama...", "keywords": ["gravedad", "fuerza de gravedad"], "explicacion": "La gravedad del Sol atrae a todos los cuerpos del sistema solar.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q18", "type": "mc", "pregunta": "Fase lunar que ocurre cuando la Luna está entre la Tierra y el Sol, por lo que su lado iluminado no es visible para nosotros:", "opciones": {"a": "Luna Llena", "b": "Cuarto Creciente", "c": "Luna Nueva"}, "correcta": "c", "explicacion": "En Luna Nueva el cielo nocturno es más oscuro.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q19", "type": "mc", "pregunta": "Planeta del Sistema Solar famoso por sus impresionantes anillos compuestos de hielo y roca:", "opciones": {"a": "Venus", "b": "Saturno", "c": "Marte"}, "correcta": "b", "explicacion": "Los anillos de Saturno son los más visibles y extensos.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q20", "type": "text", "pregunta": "Astro principal del sistema solar, es una estrella que nos brinda luz y calor vital para la vida:", "keywords": ["sol", "el sol"], "explicacion": "El Sol es una estrella enana amarilla.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q21", "type": "mc", "pregunta": "El ser humano pisó la Luna por primera vez en el año 1969, a bordo de la misión:", "opciones": {"a": "Sputnik 1", "b": "Apolo 11", "c": "Voyager"}, "correcta": "b", "explicacion": "La misión Apolo 11 llevó a Neil Armstrong y Buzz Aldrin a la Luna.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q22", "type": "mc", "pregunta": "Razón principal por la que en la Tierra hay vida tal como la conocemos:", "opciones": {"a": "Por la gran cantidad de volcanes activos", "b": "Por su distancia exacta al Sol, la presencia de agua líquida y atmósfera", "c": "Porque tiene un solo satélite natural"}, "correcta": "b", "explicacion": "Estas condiciones permiten una temperatura estable y protección contra la radiación.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q23", "type": "text", "pregunta": "Trozos de roca espacial que entran en la atmósfera terrestre y se queman brillando (conocidos como 'estrellas fugaces'):", "keywords": ["meteoritos", "meteoros", "meteoro", "meteorito"], "explicacion": "La fricción con la atmósfera los hace brillar intensamente.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q24", "type": "mc", "pregunta": "¿Qué función cumple el transbordador espacial?", "opciones": {"a": "Es una nave diseñada para ir al espacio y volver a aterrizar como un avión", "b": "Es un robot que camina en Marte", "c": "Es una antena parabólica para captar aliens"}, "correcta": "a", "explicacion": "Los transbordadores fueron naves reutilizables de la NASA.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q25", "type": "mc", "pregunta": "¿Cuál de las siguientes afirmaciones sobre el Sol es correcta?", "opciones": {"a": "Gira alrededor de la Tierra", "b": "Es un planeta de fuego", "c": "Es una esfera de gas caliente (hidrógeno y helio) que produce energía"}, "correcta": "c", "explicacion": "El Sol genera energía mediante fusión nuclear.<br><a href='resumen-ciencias-6.html' class='btn-review'>📖 Leer Resumen</a>"}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta aquí...">`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(kw))) esCorrecta = true;
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
