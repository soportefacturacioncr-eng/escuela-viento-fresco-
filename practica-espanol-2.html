<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Español 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #f39c12; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #f1c40f; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #f39c12; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #f39c12; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #d35400; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #f39c12; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Ortografía: Dos Puntos y Puntos Suspensivos</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Qué signo de puntuación detiene el discurso para llamar la atención sobre lo que sigue?", "opciones": {"a": "La coma", "b": "Los dos puntos", "c": "El punto y coma"}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "En el saludo de una carta 'Estimada abuela__ Espero que estés bien.', ¿qué signo va en el espacio?", "opciones": {"a": "Coma", "b": "Dos puntos", "c": "Punto"}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "Después de los dos puntos en el saludo de una carta, la siguiente línea comienza con:", "opciones": {"a": "Letra mayúscula", "b": "Letra minúscula", "c": "Sangría sin mayúscula"}, "correcta": "a", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "Los dos puntos se usan antes de una enumeración anunciada. ¿Qué oración es correcta?", "opciones": {"a": "Me gustan: el azul, el verde y el rojo.", "b": "Mis colores favoritos son: el azul, el verde y el rojo.", "c": "Mis colores favoritos: son azul, verde y rojo."}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "Para introducir una cita textual, se utilizan los dos puntos. ¿Cuál oración está correcta?", "opciones": {"a": "Juan me dijo: que no vendría hoy.", "b": "El jefe ordenó: 'Todos a trabajar'.", "c": "Me preguntó: cómo estaba."}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "En textos jurídicos, detrás de palabras como CERTIFICA, EXPONE o SOLICITA, se escriben:", "opciones": {"a": "Dos puntos", "b": "Puntos suspensivos", "c": "Comas"}, "correcta": "a", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "¿Cuál de estas opciones utiliza mal los dos puntos?", "opciones": {"a": "Tres cosas me gustan: leer, dormir y comer.", "b": "Sólo quiero saber: ¿por qué lo hiciste?", "c": "El ganador fue: Pedro."}, "correcta": "c", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "¿Cuántos puntos conforman exactamente el signo de 'puntos suspensivos'?", "opciones": {"a": "Dos", "b": "Tres", "c": "Cuatro"}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "Los puntos suspensivos se emplean para:", "opciones": {"a": "Finalizar una idea con contundencia", "b": "Dejar el sentido de la frase en suspenso", "c": "Separar párrafos"}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "En la oración 'Vendían dulces, confites, chocolates...', los puntos suspensivos equivalen a la palabra:", "opciones": {"a": "Finalmente", "b": "Además", "c": "Etcétera"}, "correcta": "c", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "¿Cuál oración utiliza los puntos suspensivos para expresar duda o temor?", "opciones": {"a": "Fui a la tienda, compré manzanas...", "b": "No sé si decírtelo... bueno, sí te lo diré.", "c": "Las vocales son a, e, i, o, u..."}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "Si dejamos un refrán o dicho popular incompleto porque ya se sobreentiende, usamos:", "opciones": {"a": "Dos puntos", "b": "Comillas", "c": "Puntos suspensivos"}, "correcta": "c", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "Selecciona el ejemplo correcto de refrán incompleto:", "opciones": {"a": "A caballo regalado... no se le mira el colmillo.", "b": "A caballo regalado: no se le mira el colmillo", "c": "A caballo regalado..."}, "correcta": "c", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "Si omitimos una parte de una cita textual en medio del texto, los puntos suspensivos se encierran entre:", "opciones": {"a": "Comillas (...)", "b": "Corchetes o paréntesis [...]", "c": "Guiones -...-"}, "correcta": "b", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "Después de los puntos suspensivos, si estos cierran el enunciado, la palabra siguiente comienza con:", "opciones": {"a": "Mayúscula", "b": "Minúscula", "c": "Depende del contexto"}, "correcta": "a", "explicacion": "Revisa el uso de los dos puntos y suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Signo que se coloca detrás del saludo inicial de una carta (Ej: Estimado señor):", "keywords": ["dos puntos", "los dos puntos", ":"], "explicacion": "Dos puntos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q17", "type": "text", "pregunta": "Signo de puntuación que indica que una enumeración podría continuar (equivalente a etcétera):", "keywords": ["puntos suspensivos", "los puntos suspensivos", "..."], "explicacion": "Puntos suspensivos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q18", "type": "text", "pregunta": "¿Cuántos puntos conforman exactamente los puntos suspensivos?", "keywords": ["tres", "3"], "explicacion": "Siempre son tres.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q19", "type": "text", "pregunta": "Signo que se utiliza justo antes de escribir una cita exacta de lo que alguien dijo:", "keywords": ["dos puntos", ":"], "explicacion": "Dos puntos (ej: Él dijo: ...).<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q20", "type": "text", "pregunta": "Completa con el signo correcto: 'A quien madruga... Dios lo ayuda'. ¿Qué signo va ahí?", "keywords": ["puntos suspensivos", "..."], "explicacion": "Puntos suspensivos para la pausa del refrán.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q21", "type": "text", "pregunta": "Si en un texto vemos [...], significa que se ha __________ una parte de la cita original.", "keywords": ["omitido", "borrado", "eliminado", "quitado"], "explicacion": "Significa que se omitió parte del texto original.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q22", "type": "text", "pregunta": "Signo que introducimos cuando anunciamos: 'Los ganadores son:'", "keywords": ["dos puntos", ":"], "explicacion": "Dos puntos.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Redacta una carta corta a un amigo, utilizando el saludo correcto y los dos puntos.", "keywords": [], "explicacion": "Ej: Querido amigo: \nTe escribo para contarte que iré a visitarte pronto.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: Inventa una pequeña historia de una oración que utilice los puntos suspensivos para crear suspenso o misterio.", "keywords": [], "explicacion": "Ej: Abrí la puerta lentamente y en la oscuridad vi...<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: Escribe una oración que anuncie una lista o enumeración utilizando los dos puntos correctamente.", "keywords": [], "explicacion": "Ej: Para la receta ocupamos tres ingredientes: huevos, harina y leche.<br><a href='resumen-espanol-2.html' class='btn-review'>📖 Leer Resumen</a>"}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; // Auto-evaluación
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
