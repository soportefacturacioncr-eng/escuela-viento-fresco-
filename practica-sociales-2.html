<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Estudios Sociales 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #8e44ad; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #9b59b6; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #8e44ad; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #8e44ad; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #732d91; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #8e44ad; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Historia de Costa Rica: Las Reformas Sociales de 1940</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿En qué década se dieron las grandes Reformas Sociales en Costa Rica?", "opciones": {"a": "1920", "b": "1940", "c": "1980"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "¿Cuál presidente lideró e impulsó la reforma social de 1940?", "opciones": {"a": "José Figueres Ferrer", "b": "Rafael Ángel Calderón Guardia", "c": "Tomás Guardia"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "Monseñor Víctor Manuel Sanabria representó en esta alianza política a la:", "opciones": {"a": "Iglesia Católica", "b": "Banca Privada", "c": "Oligarquía Cafetalera"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "¿Qué institución de educación superior pública fue fundada en 1940?", "opciones": {"a": "Universidad Nacional", "b": "Universidad de Costa Rica", "c": "Universidad Estatal a Distancia"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "¿Cuál fue la importancia de la creación de la Caja Costarricense de Seguro Social (CCSS)?", "opciones": {"a": "Mejorar las condiciones de salud y de vida de la población", "b": "Construir carreteras", "c": "Generar hospitales solo para extranjeros"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "El instrumento legal que regula las relaciones entre los patronos y los obreros se denomina:", "opciones": {"a": "Código Penal", "b": "Código de Trabajo", "c": "Código Civil"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "Las 'Garantías Sociales' fueron incluidas en la Constitución Política en el año:", "opciones": {"a": "1943", "b": "1940", "c": "1948"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "Manuel Mora Valverde fue una figura clave de las reformas y era el líder del partido:", "opciones": {"a": "Comunista", "b": "Liberación Nacional", "c": "Republicano"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Cuál derecho de los trabajadores está protegido por el Código de Trabajo?", "opciones": {"a": "El pago de aguinaldo y vacaciones", "b": "No pagar impuestos", "c": "Trabajar 16 horas diarias"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Antes de la creación de la CCSS, la atención médica en Costa Rica dependía principalmente de:", "opciones": {"a": "La medicina privada y hospitales de caridad", "b": "La CCSS", "c": "Seguros internacionales"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "El establecimiento de un 'salario mínimo' es una medida que busca:", "opciones": {"a": "Hacer que los ricos ganen más", "b": "Garantizar que el trabajador reciba un pago justo para vivir", "c": "Eliminar la pobreza de inmediato"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "¿Qué sector fue el más beneficiado por la aprobación de las Garantías Sociales?", "opciones": {"a": "Los banqueros", "b": "Las grandes empresas bananeras", "c": "Los trabajadores y las clases populares"}, "correcta": "c", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "La UCR (Universidad de Costa Rica) se creó para sustituir a la antigua Universidad de:", "opciones": {"a": "Santo Tomás", "b": "Heredia", "c": "San José"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "La alianza para lograr las reformas fue inusual porque unió a un gobierno conservador, a la Iglesia y a los:", "opciones": {"a": "Comunistas", "b": "Empresarios extranjeros", "c": "Banqueros"}, "correcta": "a", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "La protección en casos de enfermedad, invalidez o vejez es el objetivo central de la:", "opciones": {"a": "UCR", "b": "CCSS", "c": "Municipalidad"}, "correcta": "b", "explicacion": "Revisa los temas de la Reforma Social de 1940.<br><a href='resumen-sociales-2.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Escribe las siglas de la Caja Costarricense de Seguro Social:", "keywords": ["ccss"], "explicacion": "C.C.S.S."}, {"id": "q17", "type": "text", "pregunta": "¿En qué década del siglo XX se promulgaron las Garantías Sociales? (escribe solo el año en número)", "keywords": ["1940", "40", "los 40"], "explicacion": "Fue durante la administración de los años 40."}, {"id": "q18", "type": "text", "pregunta": "Nombre del conjunto de leyes que se promulgó para regular las reglas entre empleados y jefes: Código de...", "keywords": ["trabajo"], "explicacion": "El Código de Trabajo establece las reglas laborales."}, {"id": "q19", "type": "text", "pregunta": "Escribe las siglas de la Universidad fundada en 1940 durante el gobierno de Calderón Guardia:", "keywords": ["ucr"], "explicacion": "Universidad de Costa Rica (UCR)."}, {"id": "q20", "type": "text", "pregunta": "Primer apellido del presidente de Costa Rica que impulsó las reformas sociales en 1940:", "keywords": ["calderon", "calderón"], "explicacion": "Rafael Ángel Calderón Guardia."}, {"id": "q21", "type": "text", "pregunta": "¿A quién protegen principalmente las Garantías Sociales: al Estado, a las grandes empresas o al trabajador?", "keywords": ["trabajador", "al trabajador", "los trabajadores"], "explicacion": "Su enfoque es la protección de la clase trabajadora."}, {"id": "q22", "type": "text", "pregunta": "Primer apellido del líder comunista que apoyó las Reformas Sociales de 1940 (Manuel...):", "keywords": ["mora"], "explicacion": "Manuel Mora Valverde."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Explica la función y la importancia de la Caja Costarricense de Seguro Social (CCSS) para las familias costarricenses.", "keywords": [], "explicacion": "La CCSS es fundamental porque permite a todas las personas tener acceso a servicios de salud, cirugías y medicamentos, y asegura una pensión para la vejez o invalidez, mejorando la calidad de vida general."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: Menciona al menos dos beneficios o derechos que tienen los trabajadores en Costa Rica gracias a la creación del Código de Trabajo.", "keywords": [], "explicacion": "Ejemplos válidos: Pago de aguinaldo, jornada de 8 horas, días de vacaciones pagadas, pago de horas extras, derecho a huelga, prestaciones o liquidación."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: ¿Por qué crees que fue necesario que la Iglesia Católica, el Gobierno y el Partido Comunista (que pensaban distinto) se unieran para aprobar las reformas sociales?", "keywords": [], "explicacion": "Fue necesario unirse para tener el apoyo de la mayoría de la población y lograr aprobar leyes que incomodaban a algunos sectores ricos. La alianza demostró que se pueden superar las diferencias por el bien del país."}];
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            if (block.classList.contains('correct') || block.classList.contains('locked')) return;

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
