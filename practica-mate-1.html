<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #e74c3c; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #e74c3c; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Teoría de Números y Operaciones</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- VINCULACIÓN AL CONTROLADOR DE FIREBASE DE LA PLATAFORMA -->
<script src="controlador-firebase.js"></script>

<script>
    const dbPreguntas = [{"id": "q1", "type": "mc", "pregunta": "¿Cuál de las siguientes listas contiene SOLAMENTE números primos?", "opciones": {"a": "2, 3, 5, 9", "b": "2, 3, 5, 7", "c": "1, 2, 3, 4"}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q2", "type": "mc", "pregunta": "¿Cuál es el único número par que es primo?", "opciones": {"a": "0", "b": "2", "c": "4"}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q3", "type": "mc", "pregunta": "El número 12 es un número:", "opciones": {"a": "Primo, porque tiene dos divisores.", "b": "Compuesto, porque tiene más de dos divisores.", "c": "Ninguno de los dos."}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q4", "type": "mc", "pregunta": "Un número es divisible por 3 si:", "opciones": {"a": "Termina en 3.", "b": "Termina en número impar.", "c": "La suma de sus dígitos da un múltiplo de 3."}, "correcta": "c", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q5", "type": "mc", "pregunta": "¿Cuál de estos números es múltiplo de 5?", "opciones": {"a": "23", "b": "45", "c": "52"}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q6", "type": "mc", "pregunta": "¿Cuál es un divisor del número 15?", "opciones": {"a": "2", "b": "3", "c": "6"}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q7", "type": "mc", "pregunta": "Si un número termina en 0, ¿por cuáles números es divisible obligatoriamente?", "opciones": {"a": "2, 5 y 10", "b": "Solo por 10", "c": "3 y 5"}, "correcta": "a", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q8", "type": "mc", "pregunta": "El número 1 se clasifica como:", "opciones": {"a": "Primo", "b": "Compuesto", "c": "Ni primo ni compuesto"}, "correcta": "c", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q9", "type": "mc", "pregunta": "¿Cuál es el Mínimo Común Múltiplo (m.c.m.) de 4 y 6?", "opciones": {"a": "12", "b": "24", "c": "2"}, "correcta": "a", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q10", "type": "mc", "pregunta": "Al resolver 5 + 3 x 2, el resultado correcto es:", "opciones": {"a": "16", "b": "11", "c": "10"}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q11", "type": "mc", "pregunta": "Al resolver (5 + 3) x 2, el resultado correcto es:", "opciones": {"a": "16", "b": "11", "c": "10"}, "correcta": "a", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q12", "type": "mc", "pregunta": "¿Cuál de los siguientes números NO es primo?", "opciones": {"a": "11", "b": "13", "c": "15"}, "correcta": "c", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q13", "type": "mc", "pregunta": "El número 24 es divisible por 2 porque:", "opciones": {"a": "La suma de sus dígitos es 6.", "b": "Termina en número par (4).", "c": "Es mayor que 10."}, "correcta": "b", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q14", "type": "mc", "pregunta": "Los divisores de 8 son:", "opciones": {"a": "1, 2, 4, 8", "b": "2, 4, 8", "c": "8, 16, 24"}, "correcta": "a", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q15", "type": "mc", "pregunta": "¿Cuál es el Máximo Común Divisor (M.C.D.) de 10 y 20?", "opciones": {"a": "10", "b": "5", "c": "20"}, "correcta": "a", "explicacion": "Revisa los conceptos de teoría de números.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"}, {"id": "q16", "type": "text", "pregunta": "Escribe el número primo más pequeño de todos:", "keywords": ["2"], "explicacion": "El 2 es el primer número primo y el único par."}, {"id": "q17", "type": "text", "pregunta": "Si un número tiene solamente dos divisores (el 1 y él mismo), se le llama número...", "keywords": ["primo", "primos"], "explicacion": "Esa es la definición exacta de número primo."}, {"id": "q18", "type": "text", "pregunta": "Escribe un múltiplo de 7 que sea mayor que 10 y menor que 20:", "keywords": ["14"], "explicacion": "7 x 2 = 14."}, {"id": "q19", "type": "text", "pregunta": "Calcula mentalmente: 10 + 20 ÷ 2 = ?", "keywords": ["20"], "explicacion": "Primero se hace la división (20/2 = 10), luego se suma (10+10 = 20)."}, {"id": "q20", "type": "text", "pregunta": "El número 9, ¿es primo o compuesto?", "keywords": ["compuesto"], "explicacion": "Es compuesto porque sus divisores son 1, 3 y 9."}, {"id": "q21", "type": "text", "pregunta": "Todos los números terminados en 0 o en 5 son divisibles por...", "keywords": ["5", "cinco"], "explicacion": "Es la regla de divisibilidad del 5."}, {"id": "q22", "type": "text", "pregunta": "Escribe cuál es el resultado de 3 x 4 + 2", "keywords": ["14"], "explicacion": "Primero la multiplicación (12) y luego la suma (+2) = 14."}, {"id": "q23", "type": "textarea", "pregunta": "Desarrollo: Explica con tus palabras por qué el número 15 NO es un número primo.", "keywords": [], "explicacion": "Porque para ser primo solo puede dividirse entre 1 y 15, pero el 15 también se puede dividir entre 3 y entre 5."}, {"id": "q24", "type": "textarea", "pregunta": "Desarrollo: En un juego hay globos. Para ganar debes explotar un globo que tenga un número primo. Hay 3 globos con los números: 8, 11 y 21. ¿Cuáles puedes explotar para ganar y por qué?", "keywords": [], "explicacion": "Puedes explotar el 11 y el 21... ¡Espera, el 21 es divisible entre 3 y 7 (es compuesto)! Por lo tanto, el ÚNICO globo ganador es el 11 porque es el único número primo."}, {"id": "q25", "type": "textarea", "pregunta": "Desarrollo: Explica el orden correcto para resolver la operación 10 + 5 x (4 - 2).", "keywords": [], "explicacion": "Primero se resuelve el paréntesis (4-2=2). Luego se hace la multiplicación 5 x 2 = 10. Por último, se suma 10 + 10 = 20."}];
    
    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta aquí (solo números si es el caso)...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }

    function calificarPrueba() {
        let todasFinalizadas = true;
        let correctas = 0;
        let erroresAcumulados = [];

        dbPreguntas.forEach((q, index) => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);

            if (!block.classList.contains('correct') && !block.classList.contains('locked')) {
                let esCorrecta = false;
                let respondida = false;

                if (q.type === 'mc') {
                    const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                    if (seleccion) { 
                        respondida = true; 
                        if (seleccion.value === q.correcta) esCorrecta = true; 
                    }
                } else if (q.type === 'text') {
                    const input = document.getElementById(q.id);
                    if (input.value.trim() !== '') {
                        respondida = true;
                        if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                    }
                } else if (q.type === 'textarea') {
                    const input = document.getElementById(q.id);
                    if (input.value.trim().length > 5) {
                        respondida = true;
                        esCorrecta = true; 
                    }
                }

                if (respondida) {
                    if (esCorrecta) {
                        block.classList.add('correct');
                        
                        // EFECTO LIMPIEZA VISUAL (Oculta si no es de desarrollo)
                        if (q.type !== 'textarea') {
                            block.style.display = 'none';
                        } else {
                            fb.className = 'feedback show feedback-correct';
                            fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                        }
                        
                        deshabilitar(q);
                    } else {
                        intentosPorPregunta[q.id]++;
                        if (intentosPorPregunta[q.id] >= 2) {
                            block.classList.add('locked', 'incorrect');
                            fb.className = 'feedback show feedback-error';
                            fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                            if (q.type === 'mc') {
                                document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                                document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                            }
                            deshabilitar(q);
                        } else {
                            fb.className = 'feedback show feedback-warning';
                            fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                        }
                    }
                }
            }

            // Conteo de estados finales
            if (block.classList.contains('correct')) {
                correctas++;
            } else if (block.classList.contains('locked')) {
                let textoError = `Pregunta ${index + 1}: ${q.pregunta.substring(0, 45)}...`;
                erroresAcumulados.push(textoError);
            } else {
                todasFinalizadas = false; 
            }
        });

        // CONTROLADOR DE ENVÍO DIRECTO A FIREBASE AL COMPLETAR TODO EL EXAMEN
        if (todasFinalizadas) {
            const btn = document.getElementById('btn-grade');
            if (btn.disabled) return; 

            const notaFinal = Math.round((correctas / dbPreguntas.length) * 100);
            const tituloMateria = document.title; 
            
            btn.innerText = "Enviando resultados a la profesora...";
            btn.disabled = true;
            btn.style.background = "#7f8c8d";

            // Se comunica con el backend 'controlador-firebase.js'
            enviarNota(tituloMateria, notaFinal, erroresAcumulados).then(exito => {
                if (exito) {
                    btn.innerText = `✅ Prueba Finalizada - Nota: ${notaFinal}`;
                    btn.style.background = "#27ae60";
                } else {
                    btn.innerText = "⚠️ Error al enviar (Toca para reintentar)";
                    btn.disabled = false;
                    btn.style.background = "#e74c3c";
                }
            });
        }
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
