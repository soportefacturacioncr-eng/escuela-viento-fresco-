<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Español {num}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 3px solid #f39c12; padding-bottom: 10px; }
        h2 { color: #d35400; margin-top: 25px; }
        .highlight { background-color: #fcf3cf; border-left: 4px solid #f1c40f; padding: 15px; margin: 20px 0; border-radius: 4px; }
        .btn-nav { display: inline-block; padding: 10px 20px; background: #34495e; color: white; text-decoration: none; border-radius: 6px; margin-right: 10px; margin-bottom: 20px; font-weight: bold; }
        .btn-go { background: #f39c12; }
        .btn-nav:hover { opacity: 0.9; }
        ul li { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-nav">⬅️ Volver al Menú</a>
        <a href="practica-espanol-{num}.html" class="btn-nav btn-go">Ir a la Práctica {num} ➡️</a>

        <h1>{titulo}</h1>
        {contenido}
    </div>
</body>
</html>
