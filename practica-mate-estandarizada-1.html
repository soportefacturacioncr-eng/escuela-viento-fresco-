<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #ff7979; }
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; white-space: pre-wrap; }
        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .text-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .text-input:focus { border-color: #e74c3c; outline: none; }
        textarea.text-input { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Matemáticas: Números</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- Enlace al controlador de Firebase -->
<script src="controlador-firebase.js" type="module"></script>

<script>
    const dbPreguntas = [
        {
            "id": "q1", 
            "type": "mc", 
            "pregunta": "En un estudio científico se determinó que, en cierto instante, la distancia del Sol al planeta Saturno fue mil cuatrocientos veinticinco millones de kilómetros.\n\n¿Cuál es la representación simbólica del número que corresponde a esta distancia?", 
            "opciones": {"a": "1 000 000 425", "b": "1 000 425 000", "c": "1 425 000 000", "d": "1 400 000 025"}, 
            "correcta": "c", 
            "explicacion": "Mil cuatrocientos veinticinco millones se escribe agregando los seis ceros de los millones al número 1425, es decir: 1 425 000 000.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q2", 
            "type": "mc", 
            "pregunta": "Tiempos en segundos en una competencia de natación:\n- Karen: 53,07\n- María: 54,80\n- Natalia: 53,70\n- Patricia: 54,15\n\nSi se ordenaran esos tiempos en forma ascendente (de menor a mayor), el orden sería:", 
            "opciones": {"a": "54,80 - 54,15 - 53,70 - 53,07", "b": "53,07 - 53,70 - 54,15 - 54,80", "c": "54,80 - 54,15 - 53,07 - 53,70", "d": "53,70 - 53,07 - 54,80 - 54,15"}, 
            "correcta": "b", 
            "explicacion": "Al ordenar decimales comparamos la parte entera y luego las partes decimales. El orden de menor a mayor es: 53,07 < 53,70 < 54,15 < 54,80.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q3", 
            "type": "mc", 
            "pregunta": "Precios de productos en el supermercado:\n- Caja de leche: ₡1312\n- Caja de galletas: ₡1321\n- Caja de mantequilla: ₡2131\n- Caja de natilla: ₡1231\n\nEl número cuya notación desarrollada es 1x10³ + 3x10² + 2x10¹ + 1 corresponde al precio de la caja de:", 
            "opciones": {"a": "Leche", "b": "Galletas", "c": "Mantequilla", "d": "Natilla"}, 
            "correcta": "b", 
            "explicacion": "Resolvemos las potencias: 1000 + 300 + 20 + 1 = 1321, que corresponde a la caja de galletas.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q4", 
            "type": "mc", 
            "pregunta": "Superficie de parques nacionales (hectáreas):\n- Chirripó: 50 849\n- Guanacaste: 35 796\n- Isla del Coco: 99 635\n- Tortuguero: 26 653\n\n¿En cuál de estos parques su superficie corresponde a un número divisible por cinco?", 
            "opciones": {"a": "Chirripó", "b": "Guanacaste", "c": "Isla del Coco", "d": "Tortuguero"}, 
            "correcta": "c", 
            "explicacion": "Las reglas de divisibilidad indican que un número es divisible por 5 si su última cifra es 0 o 5. El número 99 635 cumple esta condición.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q5", 
            "type": "mc", 
            "pregunta": "Cantidad de fresas empacadas en un día:\n- Isabel: 7,9 kg\n- Marcos: 6,5 kg\n- Roberto: 7,3 kg\n- Alejandra: 6,2 kg\n\n¿Cuántos kilogramos de fresas en total empacaron las cuatro personas?", 
            "opciones": {"a": "27,0", "b": "26,9", "c": "27,9", "d": "28,0"}, 
            "correcta": "c", 
            "explicacion": "Realizamos una suma de decimales alineando la coma: 7,9 + 6,5 + 7,3 + 6,2 = 27,9 kg.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q6", 
            "type": "mc", 
            "pregunta": "Cantidad de maíz (en kilogramos) comprado en el mercado:\n- Ana: 3/2\n- Patricia: 5/7\n- Rodrigo: 3/5\n- Humberto: 7/8\n\n¿Cuál de esas personas compró una cantidad de maíz mayor que 1 kg?", 
            "opciones": {"a": "Ana", "b": "Patricia", "c": "Rodrigo", "d": "Humberto"}, 
            "correcta": "a", 
            "explicacion": "Para que una fracción sea mayor que 1 (un entero), el numerador debe ser mayor que el denominador (fracción impropia). Ana compró 3/2 que equivale a 1.5 kg.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q7", 
            "type": "mc", 
            "pregunta": "El peso promedio de un tipo de tornillo es 10,6184 g. Si el operario debe redondearlo a la centésima más cercana, ¿cuál peso debe anotar?", 
            "opciones": {"a": "10,60", "b": "10,61", "c": "10,62", "d": "10,71"}, 
            "correcta": "c", 
            "explicacion": "La centésima es la segunda posición decimal (el 1 en 10,61). Como el número que le sigue es 8 (mayor o igual a 5), se le suma 1 a la centésima, quedando en 10,62.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q8", 
            "type": "mc", 
            "pregunta": "Cantidad de manzanas por caja:\n- Roja: 13\n- Azul: 15\n- Verde: 11\n- Morada: 19\n\n¿Cuál es el color de la caja que contiene una cantidad de manzanas que corresponde a un número compuesto?", 
            "opciones": {"a": "Roja", "b": "Azul", "c": "Verde", "d": "Morada"}, 
            "correcta": "b", 
            "explicacion": "Un número compuesto tiene más de dos divisores. El 15 es compuesto porque lo dividen 1, 3, 5 y 15. Los números 11, 13 y 19 son primos.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q9", 
            "type": "mc", 
            "pregunta": "Juan Carlos compró una bolsa de arroz que tiene un peso mayor que 2 kg y menor que 3 kg. ¿Cuál de las siguientes fracciones representa este posible peso?", 
            "opciones": {"a": "2/5", "b": "3/2", "c": "5/2", "d": "7/2"}, 
            "correcta": "c", 
            "explicacion": "Si convertimos a decimales o a número mixto: 5/2 equivale a 2.5 kg, que cumple con ser mayor que 2 y menor que 3.<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q10", 
            "type": "mc", 
            "pregunta": "Francisco compró 10 naranjas y 12 guayabas. El precio de cada naranja era ₡120 y el de cada guayaba ₡280. ¿Cuál procedimiento permite conocer el monto total que pagó?", 
            "opciones": {"a": "10 x (120 + 12) x 280", "b": "(10 + 12) x (120 + 280)", "c": "(10 x 120) + (12 x 280)", "d": "(10 + 280) x (12 + 120)"}, 
            "correcta": "c", 
            "explicacion": "Se debe multiplicar la cantidad de cada fruta por su precio unitario, y luego sumar ambos totales: (10 naranjas x ₡120) + (12 guayabas x ₡280).<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q11", 
            "type": "mc", 
            "pregunta": "En una región se recolectó 1 908 938 canastos de café. ¿Cuál es la representación literal de este número?", 
            "opciones": {"a": "Un millón novecientos ocho mil novecientos treinta y ocho", "b": "Un millón novecientos ocho novecientos treinta y ocho mil", "c": "Un millón novecientos treinta y ocho mil novecientos ocho", "d": "Un millón novecientos ochenta mil novecientos treinta y ocho"}, 
            "correcta": "a", 
            "explicacion": "La lectura correcta se divide en tres partes: Un millón (1) novecientos ocho mil (908) novecientos treinta y ocho (938).<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q12", 
            "type": "mc", 
            "pregunta": "Rosaura empacó 81 naranjas en bolsas. Si cada bolsa contiene la misma cantidad, ¿cuál opción corresponde a una posible cantidad de naranjas por bolsa?", 
            "opciones": {"a": "2", "b": "3", "c": "5", "d": "10"}, 
            "correcta": "b", 
            "explicacion": "Para repartir de forma exacta, el número debe ser un divisor de 81. De las opciones, solo el 3 divide a 81 sin dejar residuo (81 ÷ 3 = 27 bolsas).<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q13", 
            "type": "mc", 
            "pregunta": "Estudiantes por grupo de música: Piano (35), Guitarra (34), Trompeta (31), Batería (37).\nEl director debe elegir un grupo para formar dos subgrupos con la misma cantidad de estudiantes, sin que sobre ninguno. ¿Cuál grupo debe elegir?", 
            "opciones": {"a": "Piano", "b": "Guitarra", "c": "Trompeta", "d": "Batería"}, 
            "correcta": "b", 
            "explicacion": "Para dividir un grupo en dos mitades exactas, la cantidad de estudiantes debe ser un número par. El grupo de Guitarra tiene 34 estudiantes (que dividido en dos es 17).<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q14", 
            "type": "mc", 
            "pregunta": "Un recipiente contiene 2 L de aceite y esta cantidad representa la cuarta parte (1/4) de su capacidad total. Si se requiere llenar ese recipiente, ¿cuántos litros de aceite se deben agregar?", 
            "opciones": {"a": "4", "b": "6", "c": "8", "d": "10"}, 
            "correcta": "b", 
            "explicacion": "Si 1/4 equivale a 2 litros, el recipiente completo (4/4) tiene capacidad para 8 litros (2 x 4). Como ya hay 2 litros, hacen falta 6 litros más para llenarlo (8 - 2 = 6).<br><a href='resumen-mate-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }
    ];

    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key.toUpperCase()}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function normalizar(texto) { return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }

    function calificarPrueba() {
        let respuestasCorrectasTotales = 0;
        let preguntasCompletadas = 0;

        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            
            if (block.classList.contains('correct')) {
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
                return;
            }
            if (block.classList.contains('locked')) {
                preguntasCompletadas++;
                return;
            }

            let esCorrecta = false;
            let respondida = false;

            if (q.type === 'mc') {
                const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
                if (seleccion) { 
                    respondida = true; 
                    if (seleccion.value === q.correcta) esCorrecta = true; 
                }
            } else if (q.type === 'text') {
                const input = document.getElementById(q.id);
                if (input.value.trim() !== '') {
                    respondida = true;
                    if (q.keywords.some(kw => normalizar(input.value).includes(normalizar(kw)))) esCorrecta = true;
                }
            } else if (q.type === 'textarea') {
                const input = document.getElementById(q.id);
                if (input.value.trim().length > 5) {
                    respondida = true;
                    esCorrecta = true; 
                }
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                if(q.type === 'textarea') {
                    fb.innerHTML = `✅ ¡Respuesta registrada! Compara tu respuesta con la explicación:<br><br>${q.explicacion}`;
                } else {
                    fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                }
                deshabilitar(q);
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    if (q.type === 'mc') {
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                        document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    }
                    deshabilitar(q);
                    preguntasCompletadas++;
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });

        if (preguntasCompletadas === dbPreguntas.length) {
            let calificacionFinal = (respuestasCorrectasTotales / dbPreguntas.length) * 100;
            
            if (typeof window.registrarResultadoPrueba === "function") {
                window.registrarResultadoPrueba({
                    materia: "Matemáticas",
                    nivel: "6° Grado",
                    tema: "Números",
                    nota: calificacionFinal.toFixed(2),
                    aciertos: respuestasCorrectasTotales,
                    totalPreguntas: dbPreguntas.length
                });
            } else {
                console.warn("La prueba terminó, pero la función del controlador no fue encontrada.");
            }

            const btnGrade = document.getElementById("btn-grade");
            btnGrade.textContent = `Prueba Finalizada - Nota: ${calificacionFinal.toFixed(0)}`;
            btnGrade.disabled = true;
            btnGrade.style.background = "#7f8c8d";
        }
    }

    function deshabilitar(q) {
        if (q.type === 'mc') document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
        else document.getElementById(q.id).disabled = true;
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
