<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Matemáticas Estandarizada 1 - Números</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background-color: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #ff7979; }
        
        .question-block { margin-bottom: 25px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-block.correct { border-color: #27ae60; background: #f0fdf4; }
        .question-block.incorrect { border-color: #e74c3c; }
        .question-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #2c3e50; line-height: 1.5; }
        
        /* Estilos para las tablas de las preguntas */
        .table-q { width: 100%; max-width: 450px; border-collapse: collapse; margin: 15px 0; font-weight: normal; }
        .table-q th, .table-q td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        .table-q th { background-color: #ecf0f1; color: #2c3e50; }

        .options label { display: block; margin-bottom: 10px; padding: 12px; background: #f8f9fa; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        
        .btn-submit { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #c0392b; }
        
        .feedback { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .feedback.show { display: block; }
        .feedback-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .feedback-correct { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        
        .btn-review { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-nav { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; padding: 10px 15px; background: #e0e0e0; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-nav">⬅️ Volver al Menú Principal</a>
    <div class="header">
        <h1>Matemáticas: Números</h1>
        <p>Escuela Viento Fresco | 6° Grado 2026 | Prof. Hillary Molina</p>
    </div>
    
    <div id="quiz-container"></div>
    <button id="btn-grade" class="btn-submit" onclick="calificarPrueba()">Revisar Respuestas</button>
</div>

<!-- Enlace al controlador de Firebase -->
<script src="controlador-firebase.js" type="module"></script>

<script>
    const dbPreguntas = [
        {
            "id": "q1", 
            "type": "mc", 
            "pregunta": "En un estudio científico se determinó que, en cierto instante, la distancia del Sol al planeta Saturno fue <strong>mil cuatrocientos veinticinco millones</strong> de kilómetros.<br><br>¿Cuál es la representación simbólica del número que corresponde a esa distancia?", 
            "opciones": {"a": "1 000 000 425", "b": "1 000 425 000", "c": "1 425 000 000", "d": "1 400 000 025"}, 
            "correcta": "c", 
            "explicacion": "Mil cuatrocientos veinticinco millones se escribe colocando el 1425 seguido de los seis ceros que representan los millones: 1 425 000 000.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q2", 
            "type": "mc", 
            "pregunta": "En la siguiente tabla se presentan los tiempos, en segundos, que tardaron cuatro personas en una competencia de natación:<br>" +
                        "<table class='table-q'><tr><th>Persona</th><th>Tiempo (en segundos)</th></tr>" +
                        "<tr><td>Karen</td><td>53,07</td></tr>" +
                        "<tr><td>María</td><td>54,80</td></tr>" +
                        "<tr><td>Natalia</td><td>53,70</td></tr>" +
                        "<tr><td>Patricia</td><td>54,15</td></tr></table>" +
                        "Si se ordenaran esos tiempos en forma <strong>ascendente (de menor a mayor)</strong>, el orden sería:", 
            "opciones": {"a": "54,80 - 54,15 - 53,70 - 53,07", "b": "53,07 - 53,70 - 54,15 - 54,80", "c": "54,80 - 54,15 - 53,07 - 53,70", "d": "53,70 - 53,07 - 54,80 - 54,15"}, 
            "correcta": "b", 
            "explicacion": "Comparamos la parte entera (53 o 54) y luego los decimales. El menor es 53,07, seguido de 53,70, luego 54,15 y el mayor es 54,80.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q3", 
            "type": "mc", 
            "pregunta": "La siguiente tabla muestra el precio de cuatro productos en un supermercado:<br>" +
                        "<table class='table-q'><tr><th>Producto</th><th>Precio (en colones)</th></tr>" +
                        "<tr><td>Caja de leche</td><td>₡1312</td></tr>" +
                        "<tr><td>Caja de galletas</td><td>₡1321</td></tr>" +
                        "<tr><td>Caja de mantequilla</td><td>₡2131</td></tr>" +
                        "<tr><td>Caja de natilla</td><td>₡1231</td></tr></table>" +
                        "El número cuya notación desarrollada es <strong>1 x 10³ + 3 x 10² + 2 x 10¹ + 1</strong> corresponde al precio de la:", 
            "opciones": {"a": "Caja de leche", "b": "Caja de galletas", "c": "Caja de mantequilla", "d": "Caja de natilla"}, 
            "correcta": "b", 
            "explicacion": "Resolviendo la suma de potencias tenemos: 1000 + 300 + 20 + 1 = 1321. Este es el precio de la caja de galletas.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q4", 
            "type": "mc", 
            "pregunta": "La siguiente tabla muestra la superficie aproximada, en hectáreas, de cuatro parques nacionales de Costa Rica:<br>" +
                        "<table class='table-q'><tr><th>Parque nacional</th><th>Superficie (hectáreas)</th></tr>" +
                        "<tr><td>Chirripó</td><td>50 849</td></tr>" +
                        "<tr><td>Guanacaste</td><td>35 796</td></tr>" +
                        "<tr><td>Isla del Coco</td><td>99 635</td></tr>" +
                        "<tr><td>Tortuguero</td><td>26 653</td></tr></table>" +
                        "¿En cuál de esos parques su superficie corresponde a un <strong>número divisible por cinco</strong>?", 
            "opciones": {"a": "Chirripó", "b": "Guanacaste", "c": "Isla del Coco", "d": "Tortuguero"}, 
            "correcta": "c", 
            "explicacion": "Todo número que termina en 0 o en 5 es divisible por cinco. La superficie de la Isla del Coco (99 635) termina en 5.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q5", 
            "type": "mc", 
            "pregunta": "En la tabla se muestra la cantidad de fresas empacadas por cuatro personas:<br>" +
                        "<table class='table-q'><tr><th>Persona</th><th>Fresas (kg)</th></tr>" +
                        "<tr><td>Isabel</td><td>7,9</td></tr>" +
                        "<tr><td>Marcos</td><td>6,5</td></tr>" +
                        "<tr><td>Roberto</td><td>7,3</td></tr>" +
                        "<tr><td>Alejandra</td><td>6,2</td></tr></table>" +
                        "¿Cuántos kilogramos de fresas en total empacaron las cuatro personas en ese día?", 
            "opciones": {"a": "27,0", "b": "26,9", "c": "27,9", "d": "28,0"}, 
            "correcta": "c", 
            "explicacion": "Al sumar los decimales alineando la coma correctamente: 7,9 + 6,5 + 7,3 + 6,2 = 27,9 kg.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q6", 
            "type": "mc", 
            "pregunta": "En la tabla se muestra la cantidad de maíz (en kilogramos) que compraron cuatro personas en el mercado:<br>" +
                        "<table class='table-q'><tr><th>Persona</th><th>Cantidad de maíz (kg)</th></tr>" +
                        "<tr><td>Ana</td><td>3/2</td></tr>" +
                        "<tr><td>Patricia</td><td>5/7</td></tr>" +
                        "<tr><td>Rodrigo</td><td>3/5</td></tr>" +
                        "<tr><td>Humberto</td><td>7/8</td></tr></table>" +
                        "De acuerdo con la información, ¿cuál persona compró una cantidad de maíz <strong>mayor que 1 kg</strong>?", 
            "opciones": {"a": "Ana", "b": "Patricia", "c": "Rodrigo", "d": "Humberto"}, 
            "correcta": "a", 
            "explicacion": "Una fracción es mayor a 1 (un entero) cuando el número de arriba (numerador) es mayor que el de abajo (denominador). Ana tiene 3/2, que es equivalente a 1.5 kg.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q7", 
            "type": "mc", 
            "pregunta": "El peso promedio de un tipo de tornillo es <strong>10,6184 g</strong>. Si el operario debe redondearlo a la <strong>centésima más cercana</strong>, ¿cuál es el peso promedio que debe anotar?", 
            "opciones": {"a": "10,60", "b": "10,61", "c": "10,62", "d": "10,71"}, 
            "correcta": "c", 
            "explicacion": "La centésima es el segundo decimal (el 1 en 10,6184). Como el número de la par (milésima) es 8 (mayor a 5), se redondea hacia arriba, sumándole uno a la centésima: 10,62.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q8", 
            "type": "mc", 
            "pregunta": "Un agricultor recolectó manzanas y las colocó en diferentes cajas:<br>" +
                        "<table class='table-q'><tr><th>Color de la caja</th><th>Cantidad de manzanas</th></tr>" +
                        "<tr><td>Roja</td><td>13</td></tr>" +
                        "<tr><td>Azul</td><td>15</td></tr>" +
                        "<tr><td>Verde</td><td>11</td></tr>" +
                        "<tr><td>Morado</td><td>19</td></tr></table>" +
                        "¿Cuál es el color de la caja que contiene una cantidad de manzanas que corresponde a un <strong>número compuesto</strong>?", 
            "opciones": {"a": "Roja", "b": "Azul", "c": "Verde", "d": "Morado"}, 
            "correcta": "b", 
            "explicacion": "Un número compuesto tiene más de dos divisores. El 15 (caja Azul) es compuesto porque se puede dividir entre 1, 3, 5 y 15. Los demás (11, 13 y 19) son primos.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q9", 
            "type": "mc", 
            "pregunta": "Juan Carlos compró una bolsa de arroz que tiene un peso <strong>mayor que 2 kg y menor que 3 kg</strong>. ¿Cuál de las siguientes fracciones representa un posible peso de la bolsa?", 
            "opciones": {"a": "2/5", "b": "3/2", "c": "5/2", "d": "7/2"}, 
            "correcta": "c", 
            "explicacion": "Si pasamos las fracciones a decimales, la fracción 5/2 equivale a 2.5 kg (la mitad de 5 es 2.5), lo cual cumple la regla de estar entre 2 y 3.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q10", 
            "type": "mc", 
            "pregunta": "Francisco compró 10 naranjas y 12 guayabas en la feria. El precio de cada naranja era ₡120 y el de cada guayaba ₡280.<br><br>¿Cuál de los siguientes procedimientos permite conocer el <strong>monto total</strong> que pagó Francisco por la compra?", 
            "opciones": {"a": "10 x (120 + 12) x 280", "b": "(10 + 12) x (120 + 280)", "c": "(10 x 120) + (12 x 280)", "d": "(10 + 280) x (12 + 120)"}, 
            "correcta": "c", 
            "explicacion": "Para saber el total, primero se multiplica la cantidad de naranjas por su precio (10 x 120), luego la cantidad de guayabas por su precio (12 x 280), y finalmente se suman ambos resultados.<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q11", 
            "type": "mc", 
            "pregunta": "En una región se recolectó <strong>1 908 938</strong> canastos de café. ¿Cuál es la representación literal correcta de este número?", 
            "opciones": {"a": "Un millón novecientos ocho mil novecientos treinta y ocho", "b": "Un millón novecientos ocho novecientos treinta y ocho mil", "c": "Un millón novecientos treinta y ocho mil novecientos ocho", "d": "Un millón novecientos ochenta mil novecientos treinta y ocho"}, 
            "correcta": "a", 
            "explicacion": "Se lee separando los grupos de números: 'Un millón' (1), 'novecientos ocho mil' (908), 'novecientos treinta y ocho' (938).<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q12", 
            "type": "mc", 
            "pregunta": "Rosaura empacó un total de <strong>81 naranjas</strong> en bolsas. Si cada una de esas bolsas contiene la misma cantidad de naranjas sin que sobre ninguna, ¿cuál de las siguientes opciones corresponde a una cantidad posible de naranjas en cada bolsa?", 
            "opciones": {"a": "2", "b": "3", "c": "5", "d": "10"}, 
            "correcta": "b", 
            "explicacion": "Para repartir de forma exacta, necesitamos un divisor de 81. El 81 no es divisible entre 2, ni entre 5, ni entre 10. Sí es divisible entre 3 (81 ÷ 3 = 27 bolsas).<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q13", 
            "type": "mc", 
            "pregunta": "En una escuela de música, el director requiere elegir uno de los grupos para formar <strong>dos subgrupos con exactamente la misma cantidad de estudiantes (sin que sobre ninguno)</strong>:<br>" +
                        "<table class='table-q'><tr><th>Grupo</th><th>Total de estudiantes</th></tr>" +
                        "<tr><td>Piano</td><td>35</td></tr>" +
                        "<tr><td>Guitarra</td><td>34</td></tr>" +
                        "<tr><td>Trompeta</td><td>31</td></tr>" +
                        "<tr><td>Batería</td><td>37</td></tr></table>" +
                        "¿Cuál de esos grupos debe elegir el director?", 
            "opciones": {"a": "Piano", "b": "Guitarra", "c": "Trompeta", "d": "Batería"}, 
            "correcta": "b", 
            "explicacion": "Para poder dividir un grupo en dos partes exactas, la cantidad debe ser un número par. El grupo de Guitarra tiene 34 estudiantes (que se pueden dividir en dos grupos de 17).<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }, 
        {
            "id": "q14", 
            "type": "mc", 
            "pregunta": "Un recipiente contiene 2 litros de aceite y esta cantidad representa la <strong>cuarta parte (1/4)</strong> de su capacidad total.<br><br>Si a partir de esa cantidad se requiere agregar más aceite hasta llenar el recipiente por completo, ¿cuántos litros más se deben agregar?", 
            "opciones": {"a": "4", "b": "6", "c": "8", "d": "10"}, 
            "correcta": "b", 
            "explicacion": "Si 1/4 (una parte) equivale a 2 litros, el recipiente completo (4 partes) tiene una capacidad de 8 litros (2 x 4). Como ya hay 2 litros adentro, solo se deben agregar 6 litros más para llenarlo (8 - 2 = 6).<br><a href='resumen-mate-estandarizada-1.html' class='btn-review'>📖 Leer Resumen</a>"
        }
    ];

    let intentosPorPregunta = {};

    function renderizarExamen() {
        const container = document.getElementById('quiz-container');
        let html = '';
        dbPreguntas.forEach((q, index) => {
            intentosPorPregunta[q.id] = 0;
            html += `<div class="question-block" id="block-${q.id}">
                        <div class="question-text">${index + 1}. ${q.pregunta}</div>`;
            
            if (q.type === 'mc') {
                html += `<div class="options" id="opts-${q.id}">`;
                for (const [key, value] of Object.entries(q.opciones)) {
                    html += `<label id="lbl-${q.id}-${key}"><input type="radio" name="${q.id}" value="${key}"> ${key.toUpperCase()}) ${value}</label>`;
                }
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="${q.id}" class="text-input" placeholder="Escribe tu respuesta corta aquí...">`;
            } else if (q.type === 'textarea') {
                html += `<textarea id="${q.id}" class="text-input" placeholder="Desarrolla tu respuesta detalladamente..."></textarea>`;
            }
            html += `<div id="feedback-${q.id}" class="feedback"></div></div>`;
        });
        container.innerHTML = html;
    }

    function calificarPrueba() {
        let respuestasCorrectasTotales = 0;
        let preguntasCompletadas = 0;

        dbPreguntas.forEach(q => {
            const block = document.getElementById(`block-${q.id}`);
            const fb = document.getElementById(`feedback-${q.id}`);
            
            if (block.classList.contains('correct') || block.classList.contains('locked')) {
                if (block.classList.contains('correct')) respuestasCorrectasTotales++;
                preguntasCompletadas++;
                return;
            }

            let esCorrecta = false;
            let respondida = false;

            const seleccion = document.querySelector(`input[name="${q.id}"]:checked`);
            if (seleccion) { 
                respondida = true; 
                if (seleccion.value === q.correcta) esCorrecta = true; 
            }

            if (!respondida) return;

            if (esCorrecta) {
                block.classList.add('correct');
                fb.className = 'feedback show feedback-correct';
                fb.innerHTML = '✅ ¡Correcto! Excelente trabajo.';
                deshabilitar(q);
                respuestasCorrectasTotales++;
                preguntasCompletadas++;
            } else {
                intentosPorPregunta[q.id]++;
                if (intentosPorPregunta[q.id] >= 2) {
                    block.classList.add('locked', 'incorrect');
                    fb.className = 'feedback show feedback-error';
                    fb.innerHTML = `❌ Agotaste tus intentos.<br><br><strong>Explicación:</strong><br>${q.explicacion}`;
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.background = '#d4edda';
                    document.getElementById(`lbl-${q.id}-${q.correcta}`).style.borderColor = '#28a745';
                    deshabilitar(q);
                    preguntasCompletadas++;
                } else {
                    fb.className = 'feedback show feedback-warning';
                    fb.innerHTML = '❌ Incorrecto. Tienes un intento más, revisa tu respuesta.';
                }
            }
        });

        if (preguntasCompletadas === dbPreguntas.length) {
            let calificacionFinal = (respuestasCorrectasTotales / dbPreguntas.length) * 100;
            
            if (typeof window.registrarResultadoPrueba === "function") {
                window.registrarResultadoPrueba({
                    materia: "Matemáticas",
                    nivel: "6° Grado",
                    tema: "Números",
                    nota: calificacionFinal.toFixed(2),
                    aciertos: respuestasCorrectasTotales,
                    totalPreguntas: dbPreguntas.length
                });
            }

            const btnGrade = document.getElementById("btn-grade");
            btnGrade.textContent = `Prueba Finalizada - Nota: ${calificacionFinal.toFixed(0)}`;
            btnGrade.disabled = true;
            btnGrade.style.background = "#7f8c8d";
        }
    }

    function deshabilitar(q) {
        document.querySelectorAll(`input[name="${q.id}"]`).forEach(r => r.disabled = true);
    }

    window.onload = renderizarExamen;
</script>
</body>
</html>
